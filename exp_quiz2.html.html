<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2-1 指數與指數函數 互動學具</title>
    
    <!-- 設定 MathJax -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            startup: {
                typeset: false // 初始先不自動渲染，由下方 JS 動態控制
            }
        };
    </script>
    <!-- 引入 MathJax 核心套件 -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        :root {
            --primary-color: #4A90E2;
            --success-color: #2ECC71;
            --danger-color: #E74C3C;
            --bg-color: #F5F7FA;
            --card-bg: #FFFFFF;
            --text-color: #2C3E50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, "PingFang TC", "微軟正黑體", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* iPad 橫向滿版設定 */
        }

        #app-container {
            width: 90%;
            max-width: 1024px;
            height: 85%;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            padding: 20px 30px;
            background: var(--primary-color);
            color: white;
            border-radius: 20px 20px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
            font-weight: bold;
        }

        .progress-bar {
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            padding: 5px 15px;
            font-size: 18px;
            font-weight: bold;
        }

        main {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .question-box {
            font-size: 28px;
            line-height: 1.6;
            margin-bottom: 40px;
            text-align: center;
            width: 100%;
            min-height: 100px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 85%;
        }

        .option-btn {
            background: #F8F9FA;
            border: 2px solid #E2E8F0;
            border-radius: 15px;
            padding: 20px 10px; 
            font-size: 24px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }

        .option-btn:hover, .option-btn:active {
            border-color: var(--primary-color);
            background: #EBF5FF;
        }

        /* 互動彈跳視窗 (Modal) */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 65%;
            max-width: 600px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }

        .modal-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .modal-feedback {
            font-size: 24px;
            color: #7F8C8D;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .modal-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s ease;
        }

        .modal-btn.success { background: var(--success-color); }
        .modal-btn.danger { background: var(--danger-color); }

        .modal-btn:active {
            opacity: 0.8;
        }

        #finish-screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        #finish-screen h1 {
            font-size: 48px;
            color: var(--primary-color);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div id="app-container">
    <header>
        <h1>2-1 指數與指數函數</h1>
        <div class="progress-bar" id="progress-text">題型 1 / 20</div>
    </header>

    <main id="quiz-screen">
        <div class="question-box" id="question-text">
            <!-- 題目渲染區 -->
        </div>
        <div class="options-grid" id="options-container">
            <!-- 選項渲染區 -->
        </div>
    </main>

    <main id="finish-screen">
        <h1>🎉 恭喜完成所有挑戰！ 🎉</h1>
        <p style="font-size: 24px; color: #7F8C8D; margin-bottom: 30px;">您已經精通了指數與指數函數的各項觀念。</p>
        <button class="modal-btn" onclick="location.reload()">再玩一次</button>
    </main>

    <!-- 回饋彈跳視窗 -->
    <div class="modal-overlay" id="feedback-modal">
        <div class="modal-box">
            <div class="modal-icon" id="modal-icon">✅</div>
            <h2 class="modal-title" id="modal-title">答對了！</h2>
            <p class="modal-feedback" id="modal-feedback"></p>
            <button class="modal-btn" id="modal-btn" onclick="handleModalAction()">繼續下一題</button>
        </div>
    </div>
</div>

<script>
    // 題庫設計：20 個題型，嚴格按照 2-1 教材順序。無「承上題」、無題目內文提示。所有 LaTeX 指令皆經過雙斜線保護。
    const questionBank = [
        // 題型 1：生活應用 (細菌分裂)
        [
            { q: "阿祥培養細菌，假設有 $1$ 隻細菌，第 $1$ 天後分裂為 $2$ 隻，依此倍增方式繼續分裂，第 $4$ 天後共有多少隻？", options: ["$16$ 隻", "$8$ 隻", "$32$ 隻", "$4$ 隻"], ans: "$16$ 隻", hint: "因為每天變 $2$ 倍，第 $4$ 天是 $2^4 = 16$ 隻。" },
            { q: "阿祥培養細菌，假設有 $1$ 隻細菌每天分裂成 $2$ 隻，依此方式繼續分裂，第 $5$ 天後共有多少隻？", options: ["$32$ 隻", "$16$ 隻", "$64$ 隻", "$10$ 隻"], ans: "$32$ 隻", hint: "第 $5$ 天的總數為 $2^5 = 32$ 隻。" },
            { q: "阿祥培養細菌，假設有 $1$ 隻細菌每天分裂成 $2$ 隻，依此方式繼續分裂，第 $6$ 天後共有多少隻？", options: ["$64$ 隻", "$32$ 隻", "$128$ 隻", "$12$ 隻"], ans: "$64$ 隻", hint: "第 $6$ 天的總數為 $2^6 = 64$ 隻。" },
            { q: "阿祥培養細菌，假設有 $1$ 隻細菌每天分裂成 $2$ 隻，依此方式繼續分裂，第 $3$ 天後共有多少隻？", options: ["$8$ 隻", "$6$ 隻", "$16$ 隻", "$9$ 隻"], ans: "$8$ 隻", hint: "第 $3$ 天的總數為 $2^3 = 8$ 隻。" },
            { q: "阿祥培養細菌，假設有 $1$ 隻細菌每天分裂成 $2$ 隻，依此方式繼續分裂，第 $7$ 天後共有多少隻？", options: ["$128$ 隻", "$64$ 隻", "$256$ 隻", "$14$ 隻"], ans: "$128$ 隻", hint: "第 $7$ 天的總數為 $2^7 = 128$ 隻。" }
        ],
        // 題型 2：指數律－相乘
        [
            { q: "根據指數律，試化簡同底數相乘的式子 $2^3 \\times 2^4$，結果為何？", options: ["$2^7$", "$2^{12}$", "$4^7$", "$4^{12}$"], ans: "$2^7$", hint: "同底數相乘，指數要「相加」：$3 + 4 = 7$。" },
            { q: "根據指數律，試化簡 $5^2 \\times 5^3$，結果為何？", options: ["$5^5$", "$5^6$", "$25^5$", "$25^6$"], ans: "$5^5$", hint: "同底數相乘，指數要「相加」：$2 + 3 = 5$。" },
            { q: "根據指數律，試化簡 $3^4 \\times 3^2$，結果為何？", options: ["$3^6$", "$3^8$", "$9^6$", "$9^8$"], ans: "$3^6$", hint: "同底數相乘，指數要「相加」：$4 + 2 = 6$。" },
            { q: "根據指數律，試化簡 $7^3 \\times 7^5$，結果為何？", options: ["$7^8$", "$7^{15}$", "$49^8$", "$49^{15}$"], ans: "$7^8$", hint: "同底數相乘，指數要「相加」：$3 + 5 = 8$。" },
            { q: "根據指數律，試化簡 $10^2 \\times 10^4$，結果為何？", options: ["$10^6$", "$10^8$", "$100^6$", "$100^8$"], ans: "$10^6$", hint: "同底數相乘，指數要「相加」：$2 + 4 = 6$。" }
        ],
        // 題型 3：指數律－次方再次方
        [
            { q: "根據指數律，試化簡次方再次方的式子 $(5^2)^3$，結果為何？", options: ["$5^6$", "$5^5$", "$25^5$", "$25^6$"], ans: "$5^6$", hint: "次方再次方，指數要「相乘」：$2 \\times 3 = 6$。" },
            { q: "根據指數律，試化簡 $(2^3)^2$，結果與下列何者相等？", options: ["$2^6$", "$2^5$", "$4^5$", "$4^6$"], ans: "$2^6$", hint: "次方再次方，指數要「相乘」：$3 \\times 2 = 6$。" },
            { q: "根據指數律，試化簡 $(3^4)^2$，結果為何？", options: ["$3^8$", "$3^6$", "$9^6$", "$9^8$"], ans: "$3^8$", hint: "次方再次方，指數要「相乘」：$4 \\times 2 = 8$。" },
            { q: "根據指數律，試化簡 $(7^2)^4$，結果為何？", options: ["$7^8$", "$7^6$", "$49^6$", "$14^4$"], ans: "$7^8$", hint: "次方再次方，指數要「相乘」：$2 \\times 4 = 8$。" },
            { q: "根據指數律，試化簡 $(10^3)^3$，結果為何？", options: ["$10^9$", "$10^6$", "$100^3$", "$30^3$"], ans: "$10^9$", hint: "次方再次方，指數要「相乘」：$3 \\times 3 = 9$。" }
        ],
        // 題型 4：指數律 - 底數相乘
        [
            { q: "根據指數律，指數相同時底數可先相乘。試計算 $2^3 \\times 5^3$ 的結果為何？", options: ["$1000$", "$100$", "$30$", "$10^9$"], ans: "$1000$", hint: "$(2 \\times 5)^3 = 10^3 = 1000$。" },
            { q: "試計算 $5^4 \\times 2^4$ 的結果為何？", options: ["$10000$", "$1000$", "$40$", "$100^4$"], ans: "$10000$", hint: "$(5 \\times 2)^4 = 10^4 = 10000$。" },
            { q: "根據指數律，計算 $(-2)^3 \\times (-5)^3$ 的結果等於下列何者？", options: ["$10^3$", "$-10^3$", "$10^6$", "$-10^6$"], ans: "$10^3$", hint: "$[(-2) \\times (-5)]^3 = 10^3 = 1000$。" },
            { q: "根據指數律，計算 $(\\frac{1}{3})^5 \\times 6^5$ 的結果等於下列何者？", options: ["$2^5$", "$3^5$", "$\\frac{1}{2^5}$", "$18^5$"], ans: "$2^5$", hint: "$(\\frac{1}{3} \\times 6)^5 = 2^5$。" },
            { q: "根據指數律，計算 $4^2 \\times (0.25)^2$ 的結果為何？", options: ["$1$", "$4$", "$16$", "$0$"], ans: "$1$", hint: "$(4 \\times 0.25)^2 = 1^2 = 1$。" }
        ],
        // 題型 5：零指數
        [
            { q: "根據零指數的定義，若底數 $a \\neq 0$，則 $5^0$ 的值為多少？", options: ["$1$", "$0$", "$5$", "無意義"], ans: "$1$", hint: "任何非零實數的 0 次方皆定義為 1。" },
            { q: "根據定義，計算 $(9999)^0$ 的結果為何？", options: ["$1$", "$0$", "$9999$", "無意義"], ans: "$1$", hint: "只要底數不為 0，任何數字的 0 次方都是 1。" },
            { q: "根據定義，計算 $(-12)^0$ 的結果為何？", options: ["$1$", "$-1$", "$0$", "$-12$"], ans: "$1$", hint: "即使底數是負數，非零實數的 0 次方依舊是 1。" },
            { q: "根據定義，計算 $100^0$ 的結果為何？", options: ["$1$", "$100$", "$0$", "$10$"], ans: "$1$", hint: "牢記觀念：非零實數的 0 次方皆為 1。" },
            { q: "根據定義，計算 $(4-\\sqrt{7})^0$ 的結果為何？", options: ["$1$", "$0$", "$4-\\sqrt{7}$", "無意義"], ans: "$1$", hint: "底數 $4-\\sqrt{7}$ 不為 0，因此它的 0 次方結果為 1。" }
        ],
        // 題型 6：負整數指數
        [
            { q: "根據負整數指數的定義，計算 $3^{-2}$ 的值為何？", options: ["$\\frac{1}{9}$", "$-6$", "$-9$", "$\\frac{1}{6}$"], ans: "$\\frac{1}{9}$", hint: "負指數代表取倒數，$3^{-2} = \\frac{1}{3^2} = \\frac{1}{9}$。" },
            { q: "根據負整數指數的定義，計算 $2^{-3}$ 的值為何？", options: ["$\\frac{1}{8}$", "$-6$", "$-8$", "$\\frac{1}{6}$"], ans: "$\\frac{1}{8}$", hint: "$2^{-3} = \\frac{1}{2^3} = \\frac{1}{8}$。" },
            { q: "根據負整數指數的定義，計算 $5^{-2}$ 的值為何？", options: ["$\\frac{1}{25}$", "$-10$", "$-25$", "$\\frac{1}{10}$"], ans: "$\\frac{1}{25}$", hint: "$5^{-2} = \\frac{1}{5^2} = \\frac{1}{25}$。" },
            { q: "根據負整數指數的定義，計算 $4^{-1}$ 的值為何？", options: ["$\\frac{1}{4}$", "$-4$", "$0.4$", "$-1$"], ans: "$\\frac{1}{4}$", hint: "負 1 次方代表原數的倒數，即 $\\frac{1}{4}$。" },
            { q: "根據負整數指數的定義，計算 $10^{-2}$ 的值為何？", options: ["$\\frac{1}{100}$", "$-20$", "$-100$", "$0.2$"], ans: "$\\frac{1}{100}$", hint: "$10^{-2} = \\frac{1}{10^2} = \\frac{1}{100}$。" }
        ],
        // 題型 7：指數律－相除
        [
            { q: "根據指數律，同底數相除時指數要相減。試化簡 $7^5 \\div 7^2$，結果為何？", options: ["$7^3$", "$1^3$", "$7^{10}$", "$7^{2.5}$"], ans: "$7^3$", hint: "同底數相除，指數要「相減」：$5 - 2 = 3$。" },
            { q: "根據指數律，試化簡 $3^6 \\div 3^4$，結果為何？", options: ["$3^2$", "$1^2$", "$3^{24}$", "$3^{10}$"], ans: "$3^2$", hint: "同底數相除，指數要「相減」：$6 - 4 = 2$。" },
            { q: "根據指數律，試化簡 $5^7 \\div 5^3$，結果為何？", options: ["$5^4$", "$1^4$", "$5^{10}$", "$5^{21}$"], ans: "$5^4$", hint: "同底數相除，指數要「相減」：$7 - 3 = 4$。" },
            { q: "根據指數律，試化簡 $2^8 \\div 2^5$，結果為何？", options: ["$2^3$", "$1^3$", "$2^{13}$", "$2^{40}$"], ans: "$2^3$", hint: "同底數相除，指數要「相減」：$8 - 5 = 3$。" },
            { q: "根據指數律，試化簡 $10^9 \\div 10^6$，結果為何？", options: ["$10^3$", "$1^3$", "$10^{15}$", "$10^{54}$"], ans: "$10^3$", hint: "同底數相除，指數要「相減」：$9 - 6 = 3$。" }
        ],
        // 題型 8：分數指數 (轉換形式)
        [
            { q: "根據分數指數的定義，若要將平方根 $\\sqrt{3}$ 寫成指數形式，下列何者正確？", options: ["$3^{\\frac{1}{2}}$", "$3^2$", "$2^3$", "$3^{-2}$"], ans: "$3^{\\frac{1}{2}}$", hint: "開 2 次方根（平方根），等同於指數為 $\\frac{1}{2}$。" },
            { q: "根據分數指數的定義，將 $\\sqrt[3]{5}$ 用分數指數形式表示，下列何者正確？", options: ["$5^{\\frac{1}{3}}$", "$5^3$", "$3^5$", "$3^{\\frac{1}{5}}$"], ans: "$5^{\\frac{1}{3}}$", hint: "開 3 次方根，等同於指數為 $\\frac{1}{3}$。" },
            { q: "根據分數指數的定義，將 $\\sqrt[4]{7}$ 用分數指數形式表示，下列何者正確？", options: ["$7^{\\frac{1}{4}}$", "$7^4$", "$4^7$", "$4^{\\frac{1}{7}}$"], ans: "$7^{\\frac{1}{4}}$", hint: "開 4 次方根，等同於指數為 $\\frac{1}{4}$。" },
            { q: "根據分數指數的定義，將 $\\sqrt{2}$ 用分數指數形式表示，下列何者正確？", options: ["$2^{\\frac{1}{2}}$", "$2^2$", "$2^{-2}$", "$1^2$"], ans: "$2^{\\frac{1}{2}}$", hint: "未寫數字的根號代表平方根，即指數為 $\\frac{1}{2}$。" },
            { q: "根據分數指數的定義，將 $\\sqrt[5]{10}$ 用分數指數形式表示，下列何者正確？", options: ["$10^{\\frac{1}{5}}$", "$10^5$", "$5^{10}$", "$5^{\\frac{1}{10}}$"], ans: "$10^{\\frac{1}{5}}$", hint: "開 5 次方根，等同於指數為 $\\frac{1}{5}$。" }
        ],
        // 題型 9：分數指數 (計算數值)
        [
            { q: "試計算 $8^{\\frac{1}{3}}$ 的值為多少？", options: ["$2$", "$4$", "$\\frac{8}{3}$", "$24$"], ans: "$2$", hint: "$8 = 2^3$，故 $(2^3)^{\\frac{1}{3}} = 2^1 = 2$。" },
            { q: "試計算 $27^{\\frac{1}{3}}$ 的值為多少？", options: ["$3$", "$9$", "$81$", "$\\frac{27}{3}$"], ans: "$3$", hint: "$27 = 3^3$，故 $(3^3)^{\\frac{1}{3}} = 3^1 = 3$。" },
            { q: "試計算 $16^{\\frac{1}{4}}$ 的值為多少？", options: ["$2$", "$4$", "$8$", "$\\frac{16}{4}$"], ans: "$2$", hint: "$16 = 2^4$，故 $(2^4)^{\\frac{1}{4}} = 2^1 = 2$。" },
            { q: "試計算 $9^{\\frac{1}{2}}$ 的值為多少？", options: ["$3$", "$4.5$", "$18$", "$\\frac{9}{2}$"], ans: "$3$", hint: "$9 = 3^2$，故 $(3^2)^{\\frac{1}{2}} = 3^1 = 3$。" },
            { q: "試計算 $32^{\\frac{1}{5}}$ 的值為多少？", options: ["$2$", "$4$", "$8$", "$16$"], ans: "$2$", hint: "$32 = 2^5$，故 $(2^5)^{\\frac{1}{5}} = 2^1 = 2$。" }
        ],
        // 題型 10：負分數指數計算

            { q: "試解指數方程式 $9^{x+1} = 27^x$，兩邊需先換成同底數，請問 $x$ 的值為何？", options: ["$2$", "$3$", "$4$", "$1$"], ans: "$2$", hint: "$3^{2(x+1)} = 3^{3x} \\Rightarrow 2x+2 = 3x \\Rightarrow x = 2$。" },
            { q: "試解指數方程式 $8^x = 4^{x+1}$，兩邊需先換成同底數，請問 $x$ 的值為何？", options: ["$2$", "$1$", "$3$", "$4$"], ans: "$2$", hint: "$2^{3x} = 2^{2(x+1)} \\Rightarrow 3x = 2x + 2 \\Rightarrow x = 2$。" },
            { q: "試解指數方程式 $16^x = 8^{x+1}$，兩邊需先換成同底數，請問 $x$ 的值為何？", options: ["$3$", "$1$", "$2$", "$4$"], ans: "$3$", hint: "$2^{4x} = 2^{3(x+1)} \\Rightarrow 4x = 3x + 3 \\Rightarrow x = 3$。" },
            { q: "試解指數方程式 $25^x = 125^{x-1}$，兩邊需先換成同底數，請問 $x$ 的值為何？", options: ["$3$", "$2$", "$4$", "$1$"], ans: "$3$", hint: "$5^{2x} = 5^{3(x-1)} \\Rightarrow 2x = 3x - 3 \\Rightarrow x = 3$。" }
        ]
    ];

    let currentTypeIndex = 0;
    let currentQuestionObj = null;
    let currentQuestionIndex = -1;
    let currentOptions = [];

    const formatMath = (text) => {
        // 利用 \scriptscriptstyle 將分數嚴格縮小，並利用正規表達式處理帶正負號的分數，確保它們能被正確上浮為指數
        let enhancedText = text.replace(/\^\{\\frac\{(.*?)\}\{(.*?)\}\}/g, '^{\\scriptscriptstyle \\frac{$1}{$2}}');
        enhancedText = enhancedText.replace(/\^\{(-?)\\frac\{(.*?)\}\{(.*?)\}\}/g, '^{$1\\scriptscriptstyle \\frac{$2}{$3}}');
        
        // 確保所有的 $...$ 內部公式前加上有效的 LaTeX \displaystyle 指令，使底數大方清晰
        return enhancedText.replace(/\$(.*?)\$/g, '$\\displaystyle $1$');
    };

    // 初始化與加載題型
    function initApp() {
        currentTypeIndex = 0;
        if (window.MathJax) {
            MathJax.startup.promise.then(() => {
                loadType(currentTypeIndex);
            }).catch((err) => console.log('MathJax 錯誤: ', err.message));
        } else {
            loadType(currentTypeIndex);
        }
    }

    function loadType(typeIndex) {
        if(typeIndex >= questionBank.length) {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('finish-screen').style.display = 'flex';
            document.getElementById('progress-text').innerText = "挑戰完成！";
            return;
        }
        
        document.getElementById('progress-text').innerText = `題型 ${typeIndex + 1} / 20`;
        
        let randomQIndex = Math.floor(Math.random() * 5);
        renderQuestion(typeIndex, randomQIndex);
    }

    function renderQuestion(typeIndex, qIndex) {
        currentTypeIndex = typeIndex;
        currentQuestionIndex = qIndex;
        currentQuestionObj = questionBank[typeIndex][qIndex];
        
        document.getElementById('question-text').innerHTML = formatMath(currentQuestionObj.q);

        currentOptions = [...currentQuestionObj.options];
        shuffleArray(currentOptions);

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        currentOptions.forEach(optText => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = formatMath(optText);
            btn.onclick = () => checkAnswer(optText);
            optionsContainer.appendChild(btn);
        });

        if(window.MathJax) {
            MathJax.typesetPromise([document.getElementById('quiz-screen')]).catch((err) => console.log(err.message));
        }
    }

    function checkAnswer(selectedText) {
        if(selectedText === currentQuestionObj.ans) {
            showModal("✅", "答對了！", "恭喜過關，觀念很正確喔！", "success", "繼續下一題", () => {
                loadType(currentTypeIndex + 1);
            });
        } else {
            showModal("😢", "答錯了", `<b>觀念提示：</b><br>${formatMath(currentQuestionObj.hint)}`, "danger", "換題再試一次", () => {
                let nextQIndex;
                do {
                    nextQIndex = Math.floor(Math.random() * 5);
                } while (nextQIndex === currentQuestionIndex);
                renderQuestion(currentTypeIndex, nextQIndex);
            });
        }
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    let modalActionCallback = null;
    function showModal(icon, title, feedback, type, btnText, callback) {
        document.getElementById('modal-icon').innerHTML = icon;
        document.getElementById('modal-title').innerHTML = title;
        document.getElementById('modal-feedback').innerHTML = feedback;
        
        const btn = document.getElementById('modal-btn');
        btn.innerHTML = btnText;
        btn.className = `modal-btn ${type}`;
        
        modalActionCallback = callback;
        document.getElementById('feedback-modal').classList.add('active');

        if(window.MathJax) {
            MathJax.typesetPromise([document.getElementById('feedback-modal')]);
        }
    }

    function handleModalAction() {
        document.getElementById('feedback-modal').classList.remove('active');
        if(modalActionCallback) {
            setTimeout(modalActionCallback, 300);
        }
    }

    window.onload = initApp;

</script>
</body>
</html>
