L[3].mp=()=>sh([1,2,3,4,5,6]).slice(0,4).map(a=>{const b=ri(1,6)*pk([1,-1]),f=pk([0,1]);return[`A${P(a,b)} 對 ${f?'y':'x'} 軸對稱`,f?P(-a,b):P(a,-b)]});
const xs=()=>{const[a,b]=rp(),f=pk([0,1]);return{q:`A${P(a,b)} 對 ${f?'y':'x'} 軸的對稱點坐標是？`,xy:1,a:f?[-a,b]:[a,-b]}};
const cnt=()=>{const[m,n]=pk([[ri(1,6),ri(1,6)],[ri(1,6),ri(1,6)],[0,ri(1,6)],[ri(1,6),0]]);return{q:`與 x 軸距離為 ${m}、與 y 軸距離為 ${n} 的點共有幾個？`,a:m&&n?4:2}};
L[3].fl=[xs,xs,cnt,cnt,()=>{const[a,b,h]=tri();return{q:`與 x 軸距離 ${a}、與 y 軸距離 ${b} 的所有點，到原點的距離是？`,a:h}},
()=>{const dx=3,dy=4,x1=ri(-5,5-dx),y1=ri(-5,5-dy),s=pk([1,-1]);return{q:'圖中 A、B 兩點的距離 AB = ？',v:[{v:[s*x1,y1],t:'A'},{v:[s*(x1+dx),y1+dy],t:'B'}],a:5}}];
const ps=()=>{const m=ri(1,5);let n;do{n=ri(1,5)}while(n==m);const k=ri(1,4),[sx,sy]=KS[k-1];return{t:`標出到 x 軸距離 ${m}、到 y 軸距離 ${n}，且在第${CN[k-1]}象限的點`,v:[sx*n,sy*m]}};
const pr=()=>{const[a,b]=rp(),f=pk([0,1]);return{t:`標出 A${P(a,b)} 對 ${f?'y':'x'} 軸的對稱點`,v:f?[-a,b]:[a,-b],sh:[{v:[a,b],t:'A'}]}};
L[3].pt=[ps,ps,pr,pr,pr];
let S={lv:0,st:0,done:[0,0,0,0]},g={};
try{const d=JSON.parse(localStorage.getItem('uq3b')||'null');if(d)S.done=d}catch(e){}
const save=()=>{try{localStorage.setItem('uq3b',JSON.stringify(S.done))}catch(e){}};
const need=i=>L[i].sg.length,lock=i=>i>0&&S.done[i-1]<need(i-1);
const go=(lv,st)=>{S.lv=lv;S.st=st;g={};render()};
const mk=a=>a.map(x=>typeof x=='function'?x():x);
function pl(pts,click,quad,ln){
 let s=`<svg id="pl" viewBox="0 0 440 440" style="width:100%;max-width:440px;background:#fff;border:1px solid #ddd;border-radius:8px;${click?'cursor:crosshair':''}" ${click?'onclick="sv(event)"':''}>`;
 for(let i=-5;i<=5;i++){const p=220+i*40;s+=`<line x1="${p}" y1="20" x2="${p}" y2="420" stroke="#e5e5e5"/><line x1="20" y1="${p}" x2="420" y2="${p}" stroke="#e5e5e5"/>`;
  if(i)s+=`<text x="${p}" y="236" text-anchor="middle" font-size="11">${ng(i)}</text><text x="212" y="${p+4}" text-anchor="end" font-size="11">${ng(-i)}</text>`}
 s+='<line x1="10" y1="220" x2="425" y2="220" stroke="#333" stroke-width="2"/><polygon points="436,220 424,214 424,226"/><line x1="220" y1="430" x2="220" y2="15" stroke="#333" stroke-width="2"/><polygon points="220,4 214,16 226,16"/><text x="428" y="240" font-size="14">x</text><text x="228" y="14" font-size="14">y</text><text x="209" y="236" font-size="12">O</text>';
 if(quad)s+=[['Ⅰ',380,60],['Ⅱ',60,60],['Ⅲ',60,400],['Ⅳ',380,400]].map(q=>`<text x="${q[1]}" y="${q[2]}" font-size="30" fill="#bbb" text-anchor="middle">${q[0]}</text>`).join('');
 (ln||[]).forEach(l=>{const x1=220+l.a[0]*40,y1=220-l.a[1]*40,x2=220+l.b[0]*40,y2=220-l.b[1]*40;s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${l.c}" stroke-width="2.5" ${l.d?'stroke-dasharray="6 4"':''}/>`+(l.t!==''&&l.t!==undefined?`<text x="${(x1+x2)/2+8}" y="${(y1+y2)/2-8}" font-size="16" font-weight="bold" fill="${l.c}" ${l.o?'text-decoration="overline"':''}>${l.t}</text>`:'')});
 (pts||[]).forEach(p=>{const x=220+p.v[0]*40,y=220-p.v[1]*40;s+=`<circle cx="${x}" cy="${y}" r="3" fill="${p.c||'#d94040'}"/>`+(p.t?`<text x="${x+6}" y="${y-6}" font-size="14" font-weight="bold" fill="${p.c||'#d94040'}">${p.t}</text>`:'')});
 return s+'</svg>'}
function render(){
 const n=need(S.lv);
 $('#nav').innerHTML='<div class="tabs">'+L.map((l,i)=>`<button class="tab ${i==S.lv?'on':''}" ${lock(i)?'disabled':''} onclick="go(${i},0)">${lock(i)?'🔒':l.ic} ${l.k}${S.done[i]>=need(i)?' ✅':''}</button>`).join('')+'</div><div class="tabs sub">'+
 ['📖 認識',...L[S.lv].sg.map((k,j)=>'①②③④⑤'[j]+' '+NM[k])].map((t,j)=>`<button class="tab ${j==S.st?'on':''}" ${j>0&&S.done[S.lv]<j-1?'disabled':''} onclick="go(${S.lv},${j})">${j>0&&S.done[S.lv]<j-1?'🔒 ':''}${t}${j>0&&S.done[S.lv]>=j?' ✔':''}</button>`).join('')+'</div>';
 [learn,...L[S.lv].sg.map(k=>FN[k])][S.st]()}
const B=h=>$('#body').innerHTML='<div class="box">'+h+'</div>';
function learn(){const lv=L[S.lv];
 B(`<h3>${lv.ic} ${lv.k}：點卡片翻面</h3>${lv.demo?pl(lv.demo,false,lv.quad):''}<div class="grid" style="margin-top:12px">`+lv.c.map(u=>`<div class="card" onclick="this.classList.toggle('f')"><div class="fr"><b>${F(u.n)}</b><small>（點一下翻面）</small></div><div class="bk"><b style="font-size:17px">${F(u.n)}</b>${F(u.m)}<br><small>${F(u.d)}</small></div></div>`).join('')+`</div><button class="btn" onclick="go(S.lv,1)">我記好了，開始闖關 ▶</button>`)}
function res(ok,txt,st){
 if(ok){S.done[S.lv]=Math.max(S.done[S.lv],st);save()}
 let nx='';
 if(ok)nx=st<need(S.lv)?`<button class="btn" onclick="go(S.lv,${st+1})">下一關 ▶</button>`:S.lv<3?`<button class="btn" onclick="go(${S.lv+1},0)">解鎖下一單元：${L[S.lv+1].k} ▶</button>`:'<h3>🏆 全部通關！直角坐標、象限、距離與對稱都學會了。</h3>';
 B(`<div class="res"><h2>${ok?'✅ 通過':'❌ 未通過'}</h2><p>${txt}</p>${nx}<button class="btn alt" onclick="go(S.lv,${st})">${ok?'再玩一次':'重新挑戰'}</button>${ok?'':`<button class="btn alt" onclick="go(S.lv,0)">回去複習</button>`}</div>`)}
function choice(){const lv=L[S.lv];
 if(!g.qs){const shf=x=>{const t=x.o[x.a],o=sh(x.o);return{...x,o,a:o.indexOf(t)}};g.qs=sh(mk(lv.ch)).slice(0,5).map(x=>x.steps?{...x,steps:x.steps.map(shf)}:shf(x));g.i=0;g.c=0;g.p=null;g.k=0;g.bad=false}
 const n=g.qs.length;
 if(g.i>=n)return res(g.c>=n,`答對 ${g.c} / ${n} 題（需全部答對；步驟題須每步都對）`,S.st);
 const u=g.qs[g.i],c=u.steps?u.steps[g.k]:u,last=!u.steps||g.k+1>=u.steps.length;
 B(`<div class="prog">第 ${g.i+1} / ${n} 題${u.steps?`　步驟 ${g.k+1} / ${u.steps.length}`:''}</div><div class="q">${F(u.q)}</div>${u.v?pl(u.v,false,false,u.ln):''}`+
 (u.steps?`<div style="margin:8px 0">${F(u.dn.slice(0,g.k+(g.p!==null?1:0)).map(t=>'✔ '+t).join('<br>'))}</div><div class="q"><b>步驟 ${g.k+1}</b>：${F(c.q)}</div>`:'')+
 c.o.map((t,j)=>{let k='';if(g.p!==null){if(j===c.a)k='ok';else if(j===g.p)k='no'}return `<button class="opt ${k}" ${g.p!==null?'disabled':''} onclick="pick(${j})">${F(t)}</button>`}).join('')+
 (g.p!==null?`<button class="btn" onclick="nx()">${!last?'下一步':g.i+1<n?'下一題':'看結果'} ▶</button>`:''))}
function pick(j){const u=g.qs[g.i],c=u.steps?u.steps[g.k]:u;if(j!==c.a)g.bad=true;g.p=j;choice()}
function nx(){const u=g.qs[g.i];if(u.steps&&g.k+1<u.steps.length){g.k++;g.p=null}else{if(!g.bad)g.c++;g.i++;g.k=0;g.bad=false;g.p=null}choice()}
function match(){const lv=L[S.lv];
 if(!g.p){g.p=typeof lv.mp=='function'?lv.mp():sh(lv.mp).slice(0,4);g.r=sh(g.p.map((_,i)=>i));g.s=null;g.dn=[];g.e=0}
 if(g.dn.length===g.p.length)return res(g.e<=1,`全部配對完成，錯誤 ${g.e} 次（需 1 次以內）`,S.st);
 B(`<div class="q">左邊選一項，再點右邊配對。　<span class="prog">錯誤 ${g.e} 次</span></div><div class="cols"><div>`+
 g.p.map((u,i)=>`<div class="m ${g.dn.includes(i)?'dn':''} ${g.s===i?'sel':''}" onclick="ml(${i})">${F(u[0])}</div>`).join('')+'</div><div>'+
 g.r.map(i=>`<div class="m ${g.dn.includes(i)?'dn':''}" onclick="mr(${i})">${F(g.p[i][1])}</div>`).join('')+'</div></div>')}
function ml(i){if(g.dn.includes(i))return;g.s=i;match()}
function mr(i){if(g.s===null||g.dn.includes(i))return;if(g.s===i)g.dn.push(i);else g.e++;g.s=null;match()}
const num=s=>{s=(s||'').trim().replace(/[−－]/g,'-');return /^-?\d+(\.\d+)?$/.test(s)?Number(s):NaN};
function fill(){const lv=L[S.lv];
 if(!g.qs){g.qs=sh(mk(lv.fl)).slice(0,4);g.ck=false}
 const d=g.ck?'disabled':'';
 B(`<div class="q">填入答案（負數請輸入負號）。</div>`+g.qs.map((x,i)=>{const v=g.v?g.v[i]:null;
  return `<div class="q">${i+1}. ${F(x.q)}${x.v?pl(x.v):''}<br>`+(x.xy?`( <input type="text" id="x${i}" ${d} value="${v?v[0]:''}"> , <input type="text" id="y${i}" ${d} value="${v?v[1]:''}"> )`:`<input type="text" id="f${i}" ${d} value="${v||''}"> ${x.u||''}`)+`<span class="fb" id="b${i}"></span></div>`}).join('')+
 (g.ck?`<button class="btn" onclick="fin()">看結果 ▶</button>`:`<button class="btn" onclick="chk()">送出</button>`));
 if(g.ck)g.qs.forEach((x,i)=>{$('#b'+i).innerHTML=g.o[i]?'✅':`❌ 正確：${x.xy?P(...x.a):x.a}`})}
function chk(){g.v=g.qs.map((x,i)=>x.xy?[$('#x'+i).value,$('#y'+i).value]:$('#f'+i).value);
 g.o=g.qs.map((x,i)=>x.xy?num(g.v[i][0])===x.a[0]&&num(g.v[i][1])===x.a[1]:num(g.v[i])===x.a);g.ck=true;fill()}
function fin(){const n=g.qs.length,c=g.o.filter(Boolean).length;res(c>=n,`答對 ${c} / ${n} 題（需全部答對）`,S.st)}
function place(){const lv=L[S.lv];
 if(!g.qs){g.qs=sh(mk(lv.pt)).slice(0,4);g.i=0;g.c=0;g.v=null;g.fb=null}
 const n=g.qs.length;
 if(g.i>=n)return res(g.c>=n,`答對 ${g.c} / ${n} 題（需全部答對）`,S.st);
 const t=g.qs[g.i];
 B(`<div class="prog">第 ${g.i+1} / ${n} 題</div><div class="q">${t.t}：點一下坐標平面上的格點，再用 ▲▼◀▶ 微調（每次 1 格）。</div>`+
 pl([...(t.sh||[]),...(g.v?[{v:g.v,t:P(...g.v),c:'#1f5fa8'}]:[]),...(g.fb?[{v:t.v,t:'正確',c:'#2e9e5b'}]:[])],!g.fb)+
 (g.fb?`<p>${g.fb}</p><button class="btn" onclick="g.i++;g.v=null;g.fb=null;place()">${g.i+1<n?'下一題':'看結果'} ▶</button>`:
 `<div><button class="btn alt" onclick="mv(0,1)">▲</button><button class="btn alt" onclick="mv(0,-1)">▼</button><button class="btn alt" onclick="mv(-1,0)">◀</button><button class="btn alt" onclick="mv(1,0)">▶</button><button class="btn" ${g.v?'':'disabled'} onclick="ok()">確定</button></div>`))}

const NM={py:'畢氏推演',ch:'選擇題',mp:'配對',fl:'填充',pt:'標點'};
const pyP=(int,two)=>{let a,b;if(int)[a,b]=pk([[3,4],[4,3]]);else do{a=ri(1,5);b=ri(1,5)}while(a==b||Number.isInteger(Math.sqrt(a*a+b*b)));
 let A0=[0,0],B0=[a,b];if(two){const x1=ri(-5,5-a),y1=ri(-5,5-b);A0=[x1,y1];B0=[x1+a,y1+b]}
 const sx=pk([1,-1]),sy=pk([1,-1]),f=p=>[sx*p[0]||0,sy*p[1]||0];let A=f(A0),B=f(B0);if(two&&Math.random()<.5)[A,B]=[B,A];
 return{A,B,C:[B[0],A[1]],a,b,n:a*a+b*b,int,h:Math.sqrt(a*a+b*b)}};
function pyth(){const two=L[S.lv].pm=='ab',seg=two?'AB':'OP';
 if(!g.ps){g.ps=[pyP(true,two),pyP(false,two)];g.i=0;g.s=0;g.e=0;g.r=null}
 if(g.i>=g.ps.length)return res(g.e==0,`錯誤 ${g.e} 次（需全程一次答對）`,S.st);
 const p=g.ps[g.i],d=g.s+(g.r?1:0),pa=v=>v<0?`(${ng(v)})`:ng(v),[x1,y1]=p.A,[x2,y2]=p.B;
 const q0=two?`橫向距離（A 到 C）= |${ng(x1)} − ${pa(x2)}| = ？`:`從原點 O 沿 x 軸走到 (${ng(x2)}, 0)，橫向的長度 = |${ng(x2)}| = ？`;
 const q1=two?`縱向距離（C 到 B）= |${ng(y1)} − ${pa(y2)}| = ？`:`再由 (${ng(x2)}, 0) 垂直走到 P，縱向的長度 = |${ng(y2)}| = ？`;
 const st=[{q:q0,a:p.a},{q:q1,a:p.b},{q:`直角三角形兩股長為 ${p.a}、${p.b}，由畢氏定理 ${seg}² = ${p.a}² + ${p.b}² = ？`,a:p.n},
 p.int?{q:`${seg} = √${p.n} = ？`,a:p.h}:{q:`${seg} = √(？)，根號內應填入的數是？`,a:p.n,rad:1}][g.s];
 g.cur=st;
 const dn=[`橫向長度 = ${p.a}`,`縱向長度 = ${p.b}`,`${seg}² = ${p.a}² + ${p.b}² = ${p.n}`,p.int?`${seg} = √${p.n} = ${p.h}`:`${seg} = √${p.n}`];
 const fin=d>=4&&p.int,ln=[{a:p.A,b:p.C,c:'#1f5fa8',d:1,t:d>=1?p.a:''},{a:p.C,b:p.B,c:'#1f5fa8',d:1,t:d>=2?p.b:''},{a:p.A,b:p.B,c:'#d94040',o:fin?0:1,t:fin?p.h:seg}];
 const pts=two?[{v:p.A,t:'A'},{v:p.B,t:'B'},{v:p.C,t:'C',c:'#555'}]:[{v:p.B,t:'P'}];
 const title=two?`A${P(x1,y1)}、B${P(x2,y2)}，求 AB（兩點的距離）。依圖中的直角三角形，一步一步算：`:`點 P${P(x2,y2)}，求原點 O 到 P 的距離 OP。依圖中的直角三角形，一步一步算：`;
 const inp=st.rad?`${F(seg)} = <span class="rt"><span class="rs">√</span><span class="rb"><input type="text" id="py"></span></span>`:`<input type="text" id="py">`;
 B(`<div class="prog">第 ${g.i+1} / ${g.ps.length} 題　錯誤 ${g.e} 次</div><div class="q">${F(title)}</div>`+pl(pts,false,false,ln)+
 `<div style="margin:8px 0">${F(dn.slice(0,d).map(t=>'✔ '+t).join('<br>'))}</div><div class="q"><b>步驟 ${g.s+1} / 4</b>：${F(st.q)}</div>`+
 (g.r?`<p>${g.r.ok?'✅ 正確':'❌ 正確答案是 '+st.a}</p><button class="btn" onclick="g.r=null;g.s++;if(g.s>3){g.i++;g.s=0}pyth()">${g.s<3?'下一步':g.i+1<g.ps.length?'下一題':'看結果'} ▶</button>`:`<div class="q">${inp} <button class="btn" onclick="pyc()">確定</button></div>`))}
function pyc(){const ok=num($('#py').value)===g.cur.a;if(!ok)g.e++;g.r={ok};pyth()}
const FN={py:pyth,ch:choice,mp:match,fl:fill,pt:place};
const cl=v=>Math.max(-5,Math.min(5,v));
function sv(e){const r=$('#pl').getBoundingClientRect();g.v=[cl(Math.round(((e.clientX-r.left)/r.width*440-220)/40)),cl(Math.round((220-(e.clientY-r.top)/r.height*440)/40))];place()}
function mv(dx,dy){const v=g.v||[0,0];g.v=[cl(v[0]+dx),cl(v[1]+dy)];place()}
function ok(){const t=g.qs[g.i];if(g.v[0]===t.v[0]&&g.v[1]===t.v[1]){g.c++;g.fb='✅ 正確'}else g.fb=`❌ 你標的是 ${P(...g.v)}，正確為 ${P(...t.v)}（綠點）`;place()}
render();
</script></body></html>
