<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>一元一次不等式 · 觀念與過關學習</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Fira+Code:wght@600;700&family=STIX+Two+Text:ital@1&display=swap');

  :root{
    --paper:#F1F4F6;
    --paper-line:#D9E1E6;
    --ink:#182333;
    --ink-soft:#4A5A6E;
    --teal:#2F6F5E;
    --teal-dark:#1F4E42;
    --teal-pale:#DCEBE6;
    --amber:#C97A2B;
    --amber-pale:#FDF3E7;
    --good:#3C8F6D;
    --good-pale:#E1F3EA;
    --bad:#C4573B;
    --bad-pale:#FBE7E1;
    --card:#FFFFFF;
    --radius:20px;
    font-size:18px; /* iPad 舒適字級基底 */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, transparent, transparent 39px, var(--paper-line) 40px),
      var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 80px;
    -webkit-tap-highlight-color: transparent;
  }
  .mono{ 
    font-family:"Fira Code", monospace; 
  }
  .varx{
    font-family:"STIX Two Text","Cambria Math","Times New Roman",serif;
    font-style:italic;
    font-weight:700;
  }

  /* ===== Header / Navigation ===== */
  .app-header{
    width:100%;
    max-width:820px;
    text-align:center;
    margin-bottom:12px;
  }
  .eyebrow{
    display:inline-block;
    font-size:.85rem;
    letter-spacing:.14em;
    color:var(--teal-dark);
    background:var(--teal-pale);
    padding:6px 16px;
    border-radius:999px;
    font-weight:700;
    margin-bottom:12px;
  }
  h1{
    font-size:clamp(1.8rem, 4.5vw, 2.5rem);
    font-weight:900;
    margin:0 0 6px;
    letter-spacing:.01em;
  }
  .subtitle{
    color:var(--ink-soft);
    font-size:1.05rem;
    margin:0 0 20px;
    line-height:1.5;
  }

  /* ===== Ruler Progress ===== */
  .ruler-wrap{
    width:100%;
    max-width:820px;
    margin-bottom:24px;
  }
  .ruler{
    position:relative;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    padding:0 8px;
  }
  .ruler::before{
    content:"";
    position:absolute;
    left:10px; right:10px; bottom:20px;
    height:4px;
    background:var(--paper-line);
    border-radius:4px;
    z-index:0;
  }
  .tick{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    flex:1;
    cursor:pointer;
  }
  .tick .dot{
    width:42px; height:42px; border-radius:50%;
    background:var(--card);
    border:3px solid var(--paper-line);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:1rem;
    color:var(--ink-soft);
    transition:all .25s ease;
    font-family:"Fira Code", monospace;
  }
  .tick.done .dot{
    background:var(--teal);
    border-color:var(--teal-dark);
    color:#fff;
  }
  .tick.active .dot{
    background:var(--card);
    border-color:var(--amber);
    color:var(--amber);
    box-shadow:0 0 0 6px rgba(201,122,43,.2);
    transform:scale(1.1);
  }
  .tick .label{
    font-size:.78rem;
    color:var(--ink-soft);
    text-align:center;
    max-width:90px;
    line-height:1.2;
    font-weight:500;
  }

  /* ===== Stage Card ===== */
  .stage-card{
    width:100%;
    max-width:820px;
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:0 4px 12px rgba(20,30,45,.05), 0 16px 40px rgba(20,30,45,.08);
    padding:32px 30px 30px;
    position:relative;
    overflow:hidden;
    border:1px solid #E2E8EC;
  }
  .stage-card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:8px;
    background:linear-gradient(90deg,var(--teal),var(--amber));
  }
  .stage-header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:12px;
  }
  .stage-kicker{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .stage-num{
    font-family:"Fira Code",monospace;
    font-weight:700;
    background:var(--ink);
    color:#fff;
    border-radius:8px;
    padding:4px 12px;
    font-size:.9rem;
  }
  .round-badge{
    font-family:"Fira Code",monospace;
    font-weight:700;
    background:var(--teal-pale);
    color:var(--teal-dark);
    border-radius:8px;
    padding:4px 12px;
    font-size:.88rem;
  }
  .review-btn-top{
    background:var(--amber-pale);
    color:var(--amber);
    border:1.5px solid var(--amber);
    font-weight:700;
    font-size:.88rem;
    padding:6px 14px;
    border-radius:10px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .review-btn-top:hover{ background:var(--amber); color:#fff; }

  .stage-title{
    font-weight:900;
    font-size:1.4rem;
    margin-top:4px;
  }
  .stage-desc{
    color:var(--ink-soft);
    font-size:1.05rem;
    margin:6px 0 22px;
    line-height:1.6;
  }

  /* Prompt Box - 徹底解決數字切頂 */
  .prompt-box{
    background:var(--paper);
    border:2px dashed #C0CCD3;
    border-radius:16px;
    padding:24px 20px;
    margin-bottom:24px;
    text-align:center;
  }
  .prompt-expr{
    font-family:"Fira Code", monospace;
    font-size:clamp(1.5rem, 5vw, 2.2rem);
    font-weight:700;
    color:var(--ink);
    letter-spacing:.02em;
    line-height:1.5; /* 加大行高避免任何裁切 */
    padding:10px 0;   /* 補足上下空間 */
    overflow:visible;
    display:inline-block;
  }
  .prompt-sub{
    margin-top:8px;
    font-size:1.05rem;
    color:var(--ink-soft);
  }

  /* Choice Buttons - 優化按鈕內距 */
  .choice-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
  }
  .choice-btn{
    font-family:"Fira Code", monospace;
    font-size:1.18rem;
    min-height:60px;
    border:2.5px solid #DDE4E8;
    background:#fff;
    color:var(--ink);
    padding:16px 20px;
    border-radius:14px;
    cursor:pointer;
    text-align:center;
    transition:all .15s ease;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1.4;
    overflow:visible;
  }
  .choice-btn:hover{ border-color:var(--teal); background:var(--teal-pale); }
  .choice-btn.selected-correct{ border-color:var(--good); background:var(--good-pale); color:var(--teal-dark);}
  .choice-btn.selected-wrong{ border-color:var(--bad); background:var(--bad-pale); color:#8C3423; animation:shake .32s;}
  .choice-btn:disabled{ cursor:default; opacity:.65;}
  .choice-btn:disabled:hover{ background:#fff; }
  .choice-btn.selected-correct:disabled, .choice-btn.selected-wrong:disabled{ opacity:1; }

  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-8px);}
    75%{transform:translateX(8px);}
  }

  /* Fill-in & Symbol Inputs */
  .fill-row{
    display:flex; align-items:center; justify-content:center; gap:12px;
    flex-wrap:wrap;
    font-family:"Fira Code", monospace;
    font-size:1.3rem;
    font-weight:700;
    margin-bottom:10px;
  }
  input.blank{
    width:95px;
    height:58px;
    text-align:center;
    font-family:"Fira Code", monospace;
    font-size:1.25rem;
    font-weight:700;
    padding:6px 8px;
    line-height:1.4;
    border-radius:12px;
    border:2.5px solid #C0CCD3;
    color:var(--ink);
    background:#fff;
  }
  input.blank:focus{ outline:none; border-color:var(--teal); box-shadow:0 0 0 4px var(--teal-pale);}

  .sym-row{
    display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin:18px 0 10px;
  }
  .sym-btn{
    width:64px; height:52px;
    font-family:"Fira Code", monospace;
    font-size:1.3rem; font-weight:700;
    border:2.5px solid #DDE4E8; background:#fff; color:var(--ink);
    border-radius:12px; cursor:pointer; transition:all .15s ease;
  }
  .sym-btn:hover{ border-color:var(--teal); background:var(--teal-pale); }
  .sym-btn.active{ border-color:var(--amber); background:#FBEEDD; color:#8A4F16; }

  .field-label{
    text-align:center;
    font-size:.95rem;
    color:var(--ink-soft);
    margin:12px 0 6px;
    font-weight:700;
  }

  /* Micro Step Dots */
  .micro-dots{
    display:flex; justify-content:center; gap:10px; margin:4px 0 18px;
  }
  .micro-dot{
    width:12px; height:12px; border-radius:50%;
    background:#DDE4E8;
    transition:all .2s ease;
  }
  .micro-dot.done{ background:var(--teal); }
  .micro-dot.active{ background:var(--amber); transform:scale(1.3); }

  /* Number Line Visualization */
  .line-visual{
    position:relative;
    height:90px;
    margin:10px 14px 28px;
  }
  .line-visual .axis{
    position:absolute; left:0; right:0; top:56px; height:4px; background:var(--ink);
    border-radius:4px;
  }
  .line-visual .arrow{
    position:absolute; top:47px; right:-2px;
    width:0;height:0;
    border-top:10px solid transparent;
    border-bottom:10px solid transparent;
    border-left:14px solid var(--ink);
  }
  .line-visual .tickmark{
    position:absolute; top:50px; width:2px; height:16px; background:#B9C3CA;
  }
  .line-visual .ticklabel{
    position:absolute; top:68px; font-family:"Fira Code", monospace; font-size:.85rem; color:var(--ink-soft); transform:translateX(-50%);
  }
  .line-visual .shade{
    position:absolute; top:22px; height:8px; background:var(--teal); border-radius:6px;
    transition:left .05s linear, width .05s linear;
  }
  .line-visual .point-marker{
    position:absolute; top:13px; width:26px; height:26px; border-radius:50%;
    border:4px solid var(--teal);
    background:#fff;
    transform:translateX(-50%);
    transition:left .05s linear;
    z-index:2;
  }
  .line-visual .point-marker.closed{ background:var(--teal); }
  .line-visual .connector{
    position:absolute; top:30px; width:0; height:28px;
    border-left:2px dashed #A0ACB5;
    transform:translateX(-50%);
    transition:left .05s linear;
  }

  .slider-row{ margin:0 10px 22px; }
  input[type=range]{
    width:100%;
    accent-color:var(--amber);
    height:10px;
  }
  input[type=range]::-webkit-slider-thumb{
    width:28px; height:28px;
  }
  .slider-readout{
    text-align:center;
    font-family:"Fira Code", monospace;
    font-weight:700;
    font-size:1.1rem;
    color:var(--amber);
    margin-top:8px;
  }

  .toggle-row{
    display:flex; justify-content:center; gap:12px; margin-bottom:20px; flex-wrap:wrap;
  }
  .toggle-btn{
    padding:12px 20px;
    min-height:50px;
    border:2.5px solid #DDE4E8; background:#fff; color:var(--ink);
    border-radius:12px; cursor:pointer; font-weight:700; font-size:1rem;
    transition:all .15s ease;
  }
  .toggle-btn:hover{ border-color:var(--teal); }
  .toggle-btn.active{ border-color:var(--teal); background:var(--teal-pale); color:var(--teal-dark); }

  /* Buttons & Action Rows */
  .action-row{
    display:flex; justify-content:center; gap:14px; margin-top:22px; flex-wrap:wrap;
  }
  .btn{
    font-family:"Noto Sans TC",sans-serif;
    font-weight:700;
    font-size:1.1rem;
    padding:15px 32px;
    min-height:52px;
    border-radius:14px;
    border:none;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .btn-primary{ background:var(--teal); color:#fff; box-shadow:0 6px 16px rgba(47,111,94,.35);}
  .btn-primary:hover{ transform:translateY(-1px); }
  .btn-primary:disabled{ opacity:.4; cursor:not-allowed; transform:none; box-shadow:none;}
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:2.5px solid #DDE4E8;}
  .btn-ghost:hover{ border-color:var(--ink-soft); color:var(--ink);}

  .feedback{
    margin-top:18px;
    text-align:center;
    font-weight:700;
    font-size:1.05rem;
    min-height:28px;
    border-radius:12px;
    padding:12px 16px;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.good{ background:var(--good-pale); color:var(--teal-dark); }
  .feedback.bad{ background:var(--bad-pale); color:#8C3423; }

  /* Start Screen & Concept Summary Styles */
  .concept-card-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin:20px 0 26px;
  }
  @media (max-width: 680px) {
    .concept-card-grid { grid-template-columns:1fr; }
  }
  .concept-item{
    background:var(--paper);
    border:1.5px solid #D4DFE5;
    border-radius:14px;
    padding:16px 18px;
  }
  .concept-item.highlight{
    background:#FFF8EE;
    border-color:#F5C992;
  }
  .concept-item-title{
    font-weight:900;
    font-size:1.05rem;
    color:var(--teal-dark);
    margin-bottom:6px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .concept-item.highlight .concept-item-title{ color:#9E540C; }
  .concept-item-desc{
    font-size:.95rem;
    color:var(--ink-soft);
    line-height:1.55;
    margin:0;
  }
  .concept-item-desc b{ color:var(--ink); }

  /* Finish Screen */
  .finish{ text-align:center; padding:24px 12px 10px; }
  .finish .medal{ font-size:4.2rem; line-height:1; margin-bottom:12px; }
  .finish h2{ font-size:1.8rem; font-weight:900; margin:0 0 10px; color:var(--teal-dark); }
  .finish p{ color:var(--ink-soft); font-size:1.1rem; margin:0 0 24px; line-height:1.6; }

  .confetti-wrap{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50; }
  .confetti-piece{
    position:absolute; top:-20px; width:10px; height:16px; opacity:.9;
    animation:fall linear forwards;
  }
  @keyframes fall{ to{ transform:translateY(110vh) rotate(540deg); opacity:.2; } }

  footer{
    margin-top:32px;
    color:#8E9CA8;
    font-size:.85rem;
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
  @media (max-width:480px){
    .stage-card{ padding:22px 16px 20px; }
    .tick .label{ display:none; }
  }
</style>
</head>
<body>

<div class="app-header">
  <span class="eyebrow">高職數學 · 觀念與過關學習</span>
  <h1>一元一次不等式</h1>
  <p class="subtitle">紮實掌握運算法則與變號關鍵！通過關卡後可隨時點選上方關卡圖示重新複習觀念。</p>
</div>

<div class="ruler-wrap">
  <div class="ruler" id="ruler"></div>
</div>

<div class="stage-card" id="stageCard"></div>

<footer>依教材《不等式及其應用》1-1 一元不等式內容設計 · iPad 觸控優化版</footer>

<script>
/* ============================================================
   一元一次不等式 互動學具 (Fira Code 字型與防切圖優化版)
   ============================================================ */

const STAGE_META = [
  {key:"add",      label:"加減性質"},
  {key:"mulpos",   label:"乘除正數"},
  {key:"mulneg",   label:"乘除負數"},
  {key:"solvepos", label:"解不等式（正係數）"},
  {key:"solveneg", label:"解不等式（負係數）"},
  {key:"line",     label:"畫在數線上"},
];

const CONCEPTS = [
  {
    title: "1. 加減性質",
    desc: "不等式兩邊同時<b>加上</b>或<b>減去</b>同一個數，<b>不等號方向不變</b>。<br>例如：若 a > b，則 a + c > b + c。"
  },
  {
    title: "2. 乘除正數",
    desc: "不等式兩邊同時<b>乘以</b>或<b>除以</b>同一個<b>正數</b>，<b>不等號方向不變</b>。<br>例如：若 a > b 且 c > 0，則 a×c > b×c。"
  },
  {
    title: "3. 乘除負數（核心！）",
    desc: "不等式兩邊同時<b>乘以</b>或<b>除以</b>同一個<b>負數</b>，<b>不等號方向必須反轉（變號）</b>！<br>例如：> 變 <、≤ 變 ≥。"
  },
  {
    title: "4. 解不等式步驟",
    desc: "<b>① 移項</b>（加變減、減變加，不變號）<br><b>② 化簡</b>常數項<br><b>③ 同除以 x 係數</b>（若係數為負，記得<b>變號</b>！）"
  },
  {
    title: "5. 數線圖示法則",
    desc: "<b>點的標示：</b>含等號（≤, ≥）用<b>實心點 ●</b>；不含等號（<, >）用<b>空心點 ○</b>。<br><b>塗色方向：</b>大於往<b>右</b>，小於往<b>左</b>。"
  }
];

let viewState = "START"; 
let currentStage = 0;
let currentRound = 0;    
let maxUnlockedStage = 0;
let reviewStageIndex = 0;
let stageData = [];      
let answered = false;

const rulerEl = document.getElementById("ruler");
const cardEl  = document.getElementById("stageCard");
const XVAR = '<span class="varx">x</span>';

/* ---------- 洗牌與隨機小工具 ---------- */
function randInt(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }

function shuffle(arr){
  const array = arr.slice();
  for(let i = array.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const temp = array[i];
    array[i] = array[j];
    array[j] = temp;
  }
  return array;
}

function signStr(n){
  if(n>0) return " + " + n;
  if(n<0) return " - " + Math.abs(n);
  return "";
}
function flipSym(sym){
  const map = {"<":">", ">":"<", "≤":"≥", "≥":"≤"};
  return map[sym];
}

function makeSymPair(){
  const pool = [ [">","≤"], ["≥","<"] ];
  const pair = pool[randInt(0,1)].slice();
  if(Math.random()<0.5) pair.reverse();
  return pair;
}
function makeSignPair(){
  const pair = ["pos","neg"];
  if(Math.random()<0.5) pair.reverse();
  return pair;
}

/* ---------- 題目產生器 ---------- */
function genAdd(sym, aSign){
  const isGT = (sym===">"||sym==="≥");
  const gap = randInt(2,7);
  let a = aSign==="pos" ? randInt(3,9) : -randInt(3,9);
  let b = isGT ? a-gap : a+gap;
  const c = randInt(2,7);
  const op = Math.random()<0.5 ? "加" : "減";
  const delta = op==="加" ? c : -c;
  const correctA = a+delta, correctB = b+delta;
  const wrongA = a-delta, wrongB = b-delta;
  const flipped = flipSym(sym);
  
  let options = shuffle([
    {text:`${correctA} ${sym} ${correctB}`, correct:true},
    {text:`${correctA} ${flipped} ${correctB}`, correct:false},
    {text:`${wrongA} ${sym} ${wrongB}`, correct:false},
  ]);
  return {
    promptExpr: `${a} ${sym} ${b}`,
    promptSub: `不等式兩邊同時「${op} ${c}」，會得到下面哪一個式子？`,
    options
  };
}

function genMulPos(sym, aSign){
  const isGT = (sym===">"||sym==="≥");
  const c = randInt(2,4);
  const op = Math.random()<0.5 ? "乘以" : "除以";
  let a,b;
  if(op==="除以"){
    const gap = randInt(1,4);
    const m = aSign==="pos" ? randInt(1,4) : -randInt(1,4);
    const n = isGT ? m-gap : m+gap;
    a = m*c; b = n*c;
  } else {
    const gap = randInt(1,5);
    const m = aSign==="pos" ? randInt(1,6) : -randInt(1,6);
    const n = isGT ? m-gap : m+gap;
    a = m; b = n;
  }
  const correctA = op==="乘以" ? a*c : a/c;
  const correctB = op==="乘以" ? b*c : b/c;
  const flipped = flipSym(sym);
  const wrongValA = op==="乘以" ? a+c : a-c;
  const wrongValB = op==="乘以" ? b+c : b-c;
  
  let options = shuffle([
    {text:`${correctA} ${sym} ${correctB}`, correct:true},
    {text:`${correctA} ${flipped} ${correctB}`, correct:false},
    {text:`${wrongValA} ${sym} ${wrongValB}`, correct:false},
  ]);
  return {
    promptExpr: `${a} ${sym} ${b}`,
    promptSub: `不等式兩邊同時「${op} ${c}」（正數），會得到下面哪一個式子？`,
    options
  };
}

function genMulNeg(sym, aSign){
  const isGT = (sym===">"||sym==="≥");
  const c = randInt(2,4);
  const op = Math.random()<0.5 ? "乘以" : "除以";
  let a,b;
  if(op==="除以"){
    const gap = randInt(1,4);
    const m = aSign==="pos" ? randInt(1,4) : -randInt(1,4);
    const n = isGT ? m-gap : m+gap;
    a = m*c; b = n*c;
  } else {
    const gap = randInt(1,5);
    const m = aSign==="pos" ? randInt(1,6) : -randInt(1,6);
    const n = isGT ? m-gap : m+gap;
    a = m; b = n;
  }
  const negC = -c;
  const correctA = op==="乘以" ? a*negC : a/negC;
  const correctB = op==="乘以" ? b*negC : b/negC;
  const correctSym = flipSym(sym);
  
  let options = shuffle([
    {text:`${correctA} ${correctSym} ${correctB}`, correct:true},
    {text:`${correctA} ${sym} ${correctB}`, correct:false},
    {text:`${op==="乘以"?a*c:a/c} ${sym} ${op==="乘以"?b*c:b/c}`, correct:false},
  ]);
  return {
    promptExpr: `${a} ${sym} ${b}`,
    promptSub: `不等式兩邊同時「${op} (${negC})」（負數），會得到下面哪一個式子？`,
    options
  };
}

function genSolvePos(sym){
  const a = randInt(2,5);
  const k = randInt(-6,6);
  let b = randInt(-6,6); while(b===0){ b = randInt(-6,6); }
  const c = a*k + b;
  return {
    a, b, c, sym, k, absB: Math.abs(b), moveCorrect: b>0 ? "sub" : "add", target: c - b,
    answerSym: sym, promptExpr: `${a}${XVAR}${signStr(b)} ${sym} ${c}`,
    promptSub: `請解出這個不等式：x ？ 多少`
  };
}

function genSolveNeg(sym){
  const a = -randInt(2,5);
  const k = randInt(-6,6);
  let b = randInt(-6,6); while(b===0){ b = randInt(-6,6); }
  const c = a*k + b;
  return {
    a, b, c, sym, k, absB: Math.abs(b), moveCorrect: b>0 ? "sub" : "add", target: c - b,
    answerSym: flipSym(sym), promptExpr: `${a}${XVAR}${signStr(b)} ${sym} ${c}`,
    promptSub: `請解出這個不等式：x ？ 多少（小心：x 的係數是負的！）`
  };
}

function genLine(sym){ return { k: randInt(-5,5), sym }; }

/* ---------- 遊戲初始化 ---------- */
function initGameData(){
  const symAdd = makeSymPair(), signAdd = makeSignPair();
  const symMulPos = makeSymPair(), signMulPos = makeSignPair();
  const symMulNeg = makeSymPair(), signMulNeg = makeSignPair();
  const symSolvePos = makeSymPair();
  const symSolveNeg = makeSymPair();
  const symLine = makeSymPair();

  stageData = [
    [genAdd(symAdd[0], signAdd[0]), genAdd(symAdd[1], signAdd[1])],
    [genMulPos(symMulPos[0], signMulPos[0]), genMulPos(symMulPos[1], signMulPos[1])],
    [genMulNeg(symMulNeg[0], signMulNeg[0]), genMulNeg(symMulNeg[1], signMulNeg[1])],
    [genSolvePos(symSolvePos[0]), genSolvePos(symSolvePos[1])],
    [genSolveNeg(symSolveNeg[0]), genSolveNeg(symSolveNeg[1])],
    [genLine(symLine[0]), genLine(symLine[1])],
  ];
}

function startNewApp(){
  initGameData();
  viewState = "START";
  currentStage = 0;
  currentRound = 0;
  maxUnlockedStage = 0;
  renderRuler();
  renderStartScreen();
}

/* ---------- 導覽軌 (Ruler) 渲染與點擊 ---------- */
function renderRuler(){
  rulerEl.innerHTML = "";
  STAGE_META.forEach((m,i)=>{
    const tick = document.createElement("div");
    let isDone = (i < currentStage) || (viewState==="FINISH");
    let isActive = (viewState==="GAME" && i===currentStage) || (viewState==="REVIEW" && i===reviewStageIndex);
    
    tick.className = "tick" + (isDone ? " done" : "") + (isActive ? " active" : "");
    tick.innerHTML = `<div class="dot">${isDone ? "✓" : i+1}</div><div class="label">${m.label}</div>`;
    
    tick.onclick = ()=>{
      if(i <= maxUnlockedStage){
        openReviewStage(i);
      } else {
        alert("請先依序完成前面的關卡，才能解鎖此關卡的觀念檢視喔！");
      }
    };
    rulerEl.appendChild(tick);
  });
}

/* ===== 3. 關卡渲染 (Game Stage Renderers) ===== */
function renderStage(){
  answered = false;
  if(currentStage >= STAGE_META.length){
    renderFinish();
    return;
  }
  const meta = STAGE_META[currentStage];
  const renderers = [renderAddMul, renderAddMul, renderAddMul, renderSolve, renderSolve, renderLine];
  renderers[currentStage](meta);
}

function nextButtonLabel(){
  if(currentRound===0) return "下一題 →";
  if(currentStage>=STAGE_META.length-1) return "完成所有挑戰 🎉";
  return "下一關 →";
}

function advance(){
  if(currentRound===0){
    currentRound = 1;
    renderStage();
  } else {
    currentStage++;
    if(currentStage > maxUnlockedStage){
      maxUnlockedStage = currentStage;
    }
    currentRound = 0;
    renderRuler();
    renderStage();
  }
  window.scrollTo({top:0, behavior:"smooth"});
}

function stageHeaderHTML(meta){
  return `
    <div class="stage-header-row">
      <div class="stage-kicker">
        <span class="stage-num mono">STAGE ${currentStage+1}/6</span>
        <span class="round-badge mono">第 ${currentRound+1}/2 題</span>
        <span class="stage-title">${meta.label}</span>
      </div>
      <button class="review-btn-top" onclick="openReviewStage(${currentStage})">📖 觀念複習</button>
    </div>
  `;
}

/* ----- 關卡 1-3：選擇題 ----- */
function renderAddMul(meta){
  const d = stageData[currentStage][currentRound];
  cardEl.innerHTML = `
    ${stageHeaderHTML(meta)}
    <p class="stage-desc">請根據不等式性質，選出正確的變形結果：</p>
    <div class="prompt-box">
      <div class="prompt-expr">${d.promptExpr}</div>
      <div class="prompt-sub">${d.promptSub}</div>
    </div>
    <div class="choice-grid" id="choiceGrid"></div>
    <div class="feedback" id="feedback"></div>
    <div class="action-row">
      <button class="btn btn-primary" id="nextBtn" disabled>${nextButtonLabel()}</button>
    </div>
  `;
  const grid = document.getElementById("choiceGrid");
  
  const displayOptions = shuffle(d.options);
  displayOptions.forEach(opt=>{
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.textContent = opt.text;
    btn.onclick = ()=> handleChoice(btn, opt.correct);
    grid.appendChild(btn);
  });
  document.getElementById("nextBtn").onclick = advance;
}

function handleChoice(btn, isCorrect){
  if(answered) return;
  const allBtns = document.querySelectorAll("#choiceGrid .choice-btn");
  if(isCorrect){
    answered = true;
    btn.classList.add("selected-correct");
    allBtns.forEach(b=>b.disabled=true);
    showFeedback(true, pickPraise());
    document.getElementById("nextBtn").disabled = false;
  } else {
    btn.classList.add("selected-wrong");
    btn.disabled = true;
    showFeedback(false, "再想想看，不等號的方向正確嗎？");
  }
}

/* ----- 關卡 4-5：解不等式 (三步驟) ----- */
function renderSolve(meta){
  const d = stageData[currentStage][currentRound];
  let micro = 0;
  let chosenSym = null;

  function dotsHTML(){
    return `<div class="micro-dots">` +
      [0,1,2].map(i=>`<span class="micro-dot ${i===micro?'active':''} ${i<micro?'done':''}"></span>`).join("") +
      `</div>`;
  }

  function draw(){
    const exprLeft = `${d.a}${XVAR}${signStr(d.b)}`;
    const opSymbolForDisplay = d.b>0 ? "-" : "+";
    const unsimplifiedRight = `${d.c} ${opSymbolForDisplay} ${d.absB}`;

    let stepHTML = "";

    if(micro===0){
      stepHTML = `
        <p class="stage-desc"><b>Step 1／3 移常數項</b> — 把常數項移到不等式右邊，兩邊要做什麼運算？</p>
        <div class="prompt-box">
          <div class="prompt-expr">${exprLeft} ${d.sym} ${d.c}</div>
          <div class="prompt-sub">左邊常數項是 ${d.b>=0? "+"+d.b : d.b}，移到右邊……</div>
        </div>
        <div class="choice-grid" id="moveChoices"></div>
        <div class="feedback" id="feedback"></div>
      `;
    } else if(micro===1){
      stepHTML = `
        <p class="stage-desc"><b>Step 2／3 合併同類項</b> — 把右邊的算式化簡成一個數字。</p>
        <div class="prompt-box">
          <div class="prompt-expr">${d.a}${XVAR} ${d.sym} ${unsimplifiedRight}</div>
          <div class="prompt-sub">右邊化簡後等於多少？</div>
        </div>
        <div class="fill-row">
          <span>${d.a}${XVAR} ${d.sym}</span>
          <input type="number" class="blank" id="targetInput" placeholder="?" inputmode="numeric">
        </div>
        <div class="action-row">
          <button class="btn btn-primary" id="checkBtn2">送出答案</button>
        </div>
        <div class="feedback" id="feedback"></div>
      `;
    } else {
      stepHTML = `
        <p class="stage-desc"><b>Step 3／3 同除以係數</b> — 兩邊同除以 ${d.a}。<b style="color:var(--bad);">注意：</b>若係數為負數，記得變號！</p>
        <div class="prompt-box">
          <div class="prompt-expr">${d.a}${XVAR} ${d.sym} ${d.target}</div>
          <div class="prompt-sub">選擇正確的不等號並填入最終數值：</div>
        </div>
        <div class="sym-row" id="symRow"></div>
        <div class="fill-row">
          <span>${XVAR}</span>
          <span id="symDisplay" class="mono" style="min-width:32px;display:inline-block;text-align:center;">?</span>
          <input type="number" class="blank" id="answerInput" placeholder="?" inputmode="numeric">
        </div>
        <div class="action-row">
          <button class="btn btn-primary" id="checkBtn3">驗證答案</button>
          <button class="btn btn-primary" id="nextBtn" style="display:none;">${nextButtonLabel()}</button>
        </div>
        <div class="feedback" id="feedback"></div>
      `;
    }

    cardEl.innerHTML = `
      ${stageHeaderHTML(meta)}
      ${dotsHTML()}
      ${stepHTML}
    `;

    if(micro===0){
      const moveContainer = document.getElementById("moveChoices");
      const moveOpts = shuffle([
        { text: `兩邊同加 ${d.absB}`, val: "add" },
        { text: `兩邊同減 ${d.absB}`, val: "sub" }
      ]);
      
      moveOpts.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = opt.text;
        btn.dataset.v = opt.val;
        btn.onclick = ()=>{
          if(btn.disabled) return;
          const isCorrect = btn.dataset.v === d.moveCorrect;
          if(isCorrect){
            btn.classList.add("selected-correct");
            document.querySelectorAll("#moveChoices .choice-btn").forEach(b=>b.disabled=true);
            showFeedback(true, pickPraise());
            setTimeout(()=>{ micro = 1; draw(); }, 500);
          } else {
            btn.classList.add("selected-wrong");
            btn.disabled = true;
            showFeedback(false, "移項方向不太對，再想想看～");
          }
        };
        moveContainer.appendChild(btn);
      });
    } else if(micro===1){
      document.getElementById("checkBtn2").onclick = ()=>{
        const val = document.getElementById("targetInput").value;
        if(val===""){ showFeedback(false, "請先填入數值"); return; }
        if(Number(val) === d.target){
          showFeedback(true, pickPraise());
          document.getElementById("checkBtn2").disabled = true;
          document.getElementById("targetInput").disabled = true;
          setTimeout(()=>{ micro = 2; draw(); }, 500);
        } else {
          showFeedback(false, "右邊數線計算不太對，再算一次看看～");
        }
      };
    } else {
      const symRow = document.getElementById("symRow");
      ["<","≤",">","≥"].forEach(s=>{
        const b = document.createElement("button");
        b.className = "sym-btn";
        b.textContent = s;
        b.onclick = ()=>{
          if(answered) return;
          chosenSym = s;
          document.querySelectorAll(".sym-btn").forEach(x=>x.classList.remove("active"));
          b.classList.add("active");
          document.getElementById("symDisplay").textContent = s;
        };
        symRow.appendChild(b);
      });

      document.getElementById("checkBtn3").onclick = ()=>{
        if(answered) return;
        const val = document.getElementById("answerInput").value;
        if(chosenSym===null || val===""){
          showFeedback(false, "不等號與數值都要選擇/填寫喔！");
          return;
        }
        if(chosenSym === d.answerSym && Number(val) === d.k){
          answered = true;
          showFeedback(true, pickPraise());
          document.getElementById("checkBtn3").style.display="none";
          document.getElementById("nextBtn").style.display="inline-flex";
          document.getElementById("answerInput").disabled = true;
          document.querySelectorAll(".sym-btn").forEach(x=>x.disabled=true);
        } else {
          showFeedback(false, "答案還不對喔！檢查除以負數時不等號有沒有變號？");
        }
      };
      document.getElementById("nextBtn").onclick = advance;
    }
  }

  draw();
}

/* ----- 關卡 6：數線圖示 ----- */
function renderLine(meta){
  const d = stageData[currentStage][currentRound];
  cardEl.innerHTML = `
    ${stageHeaderHTML(meta)}
    <p class="stage-desc">拖曳滑桿選擇點的位置，並設定「空心／實心」與塗色方向：</p>
    <div class="prompt-box">
      <div class="prompt-expr">${XVAR} ${d.sym} ${d.k}</div>
      <div class="prompt-sub">調整下方控制項，在數線上畫出正確圖示</div>
    </div>

    <div class="line-visual" id="lineVisual">
      <div class="axis"></div>
      <div class="arrow"></div>
      <div class="shade" id="shadeEl"></div>
      <div class="connector" id="connectorEl"></div>
      <div class="point-marker" id="pointEl"></div>
    </div>

    <div class="slider-row">
      <input type="range" min="-6" max="6" step="1" value="0" id="posSlider">
      <div class="slider-readout" id="posReadout">目前位置：0</div>
    </div>

    <div class="field-label">1. 這個點要畫成？</div>
    <div class="toggle-row" id="dotToggle">
      <button class="toggle-btn" data-v="open">空心 ○（不含此點）</button>
      <button class="toggle-btn" data-v="closed">實心 ●（含此點）</button>
    </div>

    <div class="field-label">2. 往哪個方向塗色？</div>
    <div class="toggle-row" id="dirToggle">
      <button class="toggle-btn" data-v="left">← 往左（小於）</button>
      <button class="toggle-btn" data-v="right">往右 →（大於）</button>
    </div>

    <div class="action-row">
      <button class="btn btn-primary" id="checkBtn">驗證數線</button>
      <button class="btn btn-primary" id="nextBtn" style="display:none;">${nextButtonLabel()}</button>
    </div>
    <div class="feedback" id="feedback"></div>
  `;

  const visual = document.getElementById("lineVisual");
  const minV=-6, maxV=6;
  for(let v=minV; v<=maxV; v++){
    const pct = ((v-minV)/(maxV-minV))*100;
    const tm = document.createElement("div");
    tm.className = "tickmark";
    tm.style.left = `calc(${pct}% )`;
    visual.appendChild(tm);
    if(v%2===0){
      const tl = document.createElement("div");
      tl.className = "ticklabel mono";
      tl.style.left = `calc(${pct}% )`;
      tl.textContent = v;
      visual.appendChild(tl);
    }
  }

  const slider = document.getElementById("posSlider");
  const readout = document.getElementById("posReadout");
  const pointEl = document.getElementById("pointEl");
  const shadeEl = document.getElementById("shadeEl");
  const connectorEl = document.getElementById("connectorEl");
  let chosenDot = null, chosenDir = null;

  function posPct(v){ return ((v-minV)/(maxV-minV))*100; }

  function updatePoint(){
    const v = Number(slider.value);
    readout.textContent = "目前位置：" + v;
    const pct = posPct(v);
    pointEl.style.left = pct + "%";
    pointEl.classList.toggle("closed", chosenDot==="closed");
    connectorEl.style.left = pct + "%";
    updateShade(pct);
  }

  function updateShade(pct){
    if(chosenDir==="left"){
      shadeEl.style.left = "0%";
      shadeEl.style.width = pct + "%";
    } else if(chosenDir==="right"){
      shadeEl.style.left = pct + "%";
      shadeEl.style.width = (100-pct) + "%";
    } else {
      shadeEl.style.width = "0%";
    }
  }

  slider.oninput = updatePoint;
  updatePoint();

  document.getElementById("dotToggle").querySelectorAll(".toggle-btn").forEach(b=>{
    b.onclick = ()=>{
      if(answered) return;
      chosenDot = b.dataset.v;
      document.getElementById("dotToggle").querySelectorAll(".toggle-btn").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      updatePoint();
    };
  });

  document.getElementById("dirToggle").querySelectorAll(".toggle-btn").forEach(b=>{
    b.onclick = ()=>{
      if(answered) return;
      chosenDir = b.dataset.v;
      document.getElementById("dirToggle").querySelectorAll(".toggle-btn").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      updatePoint();
    };
  });

  document.getElementById("checkBtn").onclick = ()=>{
    if(answered) return;
    const v = Number(slider.value);
    const needDot = (d.sym==="≤"||d.sym==="≥") ? "closed" : "open";
    const needDir = (d.sym==="<"||d.sym==="≤") ? "left" : "right";

    if(chosenDot===null || chosenDir===null){
      showFeedback(false, "空心/實心 與 塗色方向 都要選擇喔！");
      return;
    }
    if(v===d.k && chosenDot===needDot && chosenDir===needDir){
      answered = true;
      showFeedback(true, pickPraise());
      document.getElementById("checkBtn").style.display="none";
      document.getElementById("nextBtn").style.display="inline-flex";
      slider.disabled = true;
    } else {
      showFeedback(false, "檢查一下：點的位置、空實心（有無等號）、塗色方向（大小於）都符合嗎？");
    }
  };
  document.getElementById("nextBtn").onclick = advance;
}

/* ---------- 訊息與完成畫面 ---------- */
const PRAISES = ["答對了，太棒了！","完全正確！觀念很清晰！","很好，掌握到核心重點了！","答對囉，繼續保持！","漂亮，解題非常精準！"];
function pickPraise(){ return PRAISES[randInt(0,PRAISES.length-1)]; }

function showFeedback(good, text){
  const fb = document.getElementById("feedback");
  fb.textContent = (good?"✅ ":"❌ ") + text;
  fb.className = "feedback show " + (good?"good":"bad");
}

function renderFinish(){
  viewState = "FINISH";
  renderRuler();
  cardEl.innerHTML = `
    <div class="finish">
      <div class="medal">🏆</div>
      <h2>恭喜完成所有關卡挑戰！</h2>
      <p>你已經完美掌握不等式的加減乘除性質、運算變號法則，以及數線圖示！做得非常出色！</p>
      <div class="action-row">
        <button class="btn btn-primary" id="restartBtn" style="font-size:1.15rem; padding:16px 36px;">重新挑戰（產生全新題目）🔄</button>
      </div>
    </div>
  `;
  document.getElementById("restartBtn").onclick = startNewApp;
  launchConfetti();
}

function launchConfetti(){
  const wrap = document.createElement("div");
  wrap.className = "confetti-wrap";
  document.body.appendChild(wrap);
  const colors = ["#2F6F5E","#C97A2B","#3C8F6D","#C4573B","#4A5A6E"];
  for(let i=0;i<75;i++){
    const p = document.createElement("div");
    p.className = "confetti-piece";
    p.style.left = Math.random()*100+"vw";
    p.style.background = colors[randInt(0,colors.length-1)];
    p.style.animationDuration = (2.0+Math.random()*1.8)+"s";
    p.style.animationDelay = (Math.random()*0.5)+"s";
    wrap.appendChild(p);
  }
  setTimeout(()=>wrap.remove(), 4500);
}

/* ---------- 啟動程式 ---------- */
startNewApp();
</script>
