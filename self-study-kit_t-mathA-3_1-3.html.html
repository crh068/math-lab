*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}

.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:1.6vh 1.4vw}
.lab{font-size:.72em;color:var(--mut);font-weight:700;margin-bottom:.8vh}

#board .ln{padding:.4vh 0;border-bottom:1px dashed var(--bd);line-height:1.8}

.go{background:var(--ac);color:#fff;border-color:var(--ac);font-size:1.05em;font-weight:700;width:100%}

button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
i{font-family:"Times New Roman","Noto Serif TC",serif;font-style:italic}
.big{font-size:1.4em;font-weight:700;color:var(--ok)}
.gl{stroke:var(--bd);stroke-width:1}.ga{stroke:var(--ink);stroke-width:1.8}.gf{fill:var(--ink)}.gt{fill:var(--mut);font-size:12px}.gd{fill:var(--mut);opacity:.45}

const P=[
{t:'重點',e:`重點整理：線性規劃`,g:G0,ans:'已完成重點整理，可進入第 16 題',s:[
 {q:`線性規劃探討的是哪一類問題？`,k:'c',o:[`在聯立不等式條件下，求 ${FX} 的最大或最小值`,'解一元二次方程式的根','求兩條直線的交點坐標','求等差數列的前 <i>n</i> 項和'],a:0,h:`關鍵字是「聯立不等式」與「最大值或最小值」。`,l:`線性規劃：在 (${X}, ${Y}) 滿足聯立不等式的條件下，求 ${FX} 的最大值或最小值`},
 {q:`線性規劃應用問題有 5 個解題步驟，目前順序是打亂的。請依<b>正確的先後順序</b>，依序點選。`,k:'o',sep:'　→　',o:{e:'求極值',c:'繪圖',a:'列表',d:'目標函數',b:'限制條件'},a:['a','b','c','d','e'],h:`先把題目資料整理成表（需設變數），最後才求出最大或最小值。`,l:`步驟：列表 → 限制條件 → 繪圖 → 目標函數 → 求極值`},
 {q:`「限制條件」這一步要做什麼？`,k:'c',o:['依題意列出聯立不等式',`畫出可行解區域`,`將頂點代入求最大值`,`設定 ${FX} 的式子`],a:0,h:`「限制」對應題目中「不超過」「至少」等條件，數學上用不等式表示。`,l:`限制條件：依題意列出聯立不等式`},
 {k:'g',t:'line',c:[1,1,4],lab:`${X} + ${Y} = 4`,q:`<b>繪圖練習：</b>在 ${X} ≥ 0、${Y} ≥ 0 的條件下，畫出 ${X} + ${Y} ≤ 4 的區域。先畫邊界直線 ${X} + ${Y} = 4。令 ${Y} = 0，${X} = ?；令 ${X} = 0，${Y} = ?。請在圖上點選直線上的兩個點。`,h:`點的兩個坐標相加必須等於 4。可以先試 ${X} 軸與 ${Y} 軸上的點。`,l:`邊界直線 ${X} + ${Y} = 4 已畫出`},
 {k:'g',t:'side',cs:[[1,1,4,'le']],q:`<b>只有一個不等式時，可以直接塗色：</b>邊界直線把平面分成兩側。請點選一個滿足 ${X} + ${Y} ≤ 4 的點，圖上會把該側整片塗色。`,h:`把點的坐標代入 ${X} + ${Y}，結果要小於或等於 4。可以先用原點 (0, 0) 檢驗。`,l:`單一不等式 ${X} + ${Y} ≤ 4：直線下方整個半平面塗色`},
{k:'g',t:'arrow',clear:1,c:[1,1,4,'le'],lab:`${X} + ${Y} ≤ 4`,q:`<b>有多個不等式時，改用箭頭：</b>現在條件是 ${X} + ${Y} ≤ 4、${X} ≥ 0、${Y} ≥ 0。先用箭頭記錄每個不等式的範圍，最後再找重疊處。第一個：${X} + ${Y} ≤ 4。請點選一個滿足 ${X} + ${Y} ≤ 4 的點，箭頭會從邊界線垂直指向滿足的一側。`,h:`把點的坐標代入 ${X} + ${Y}，結果要小於或等於 4。`,l:`箭頭標示 ${X} + ${Y} ≤ 4（指向直線下方）；先前的整片塗色已清除`},
{k:'g',t:'arrow',c:[1,0,0,'ge'],lab:`${X} ≥ 0`,q:`${X} ≥ 0 的邊界是 ${Y} 軸。請點選一個滿足 ${X} ≥ 0 的點，箭頭會從邊界線垂直指向滿足的一側。`,h:`橫坐標要大於或等於 0。`,l:`箭頭標示 ${X} ≥ 0（指向 ${Y} 軸右側）`},
{k:'g',t:'arrow',c:[0,1,0,'ge'],lab:`${Y} ≥ 0`,q:`${Y} ≥ 0 的邊界是 ${X} 軸。請點選一個滿足 ${Y} ≥ 0 的點，箭頭會從邊界線垂直指向滿足的一側。`,h:`縱坐標要大於或等於 0。`,l:`箭頭標示 ${Y} ≥ 0（指向 ${X} 軸上方）`},
{k:'g',t:'side',cs:[[1,1,4,'le'],[1,0,0,'ge'],[0,1,0,'ge']],q:`<b>找重疊處：</b>三組箭頭同時指向的區域就是可行解區域。請點選該重疊區域內的一點，圖上會塗色。`,h:`這個點要同時滿足 ${X} + ${Y} ≤ 4、${X} ≥ 0、${Y} ≥ 0。`,l:`重疊處塗色：可行解區域為三角形`},
{k:'g',t:'vert',pts:[[0,0],[4,0],[0,4]],q:`<b>求頂點：</b>可行解區域由邊界直線與坐標軸圍成。請在圖上點選區域的每一個頂點（共 3 個）。`,h:`頂點是區域邊界線的交點（轉角處）：${X} 軸、${Y} 軸、直線 ${X} + ${Y} = 4 兩兩相交。`,l:`頂點：(0, 0)、(4, 0)、(0, 4)`},
 {q:`「繪圖」畫出可行解區域後，還要求出區域中的什麼？`,k:'c',o:['各邊的長度','各頂點的坐標','區域的面積','區域的中心點'],a:1,h:`下一步要把特定的點代入目標函數。哪些點才是候選？`,l:`繪圖：畫出可行解區域，並求出各頂點坐標`},
 {q:`「求極值」怎麼做？`,k:'c',o:['取區域內部任意一點代入','將各頂點代入目標函數 <i>f</i>(<i>x</i>, <i>y</i>)，比較大小','只需代入原點 (0, 0)','解兩個聯立方程式'],a:1,h:`最大值與最小值會出現在可行解區域的頂點上。`,l:`求極值：各頂點代入 ${FX}，比較出最大值或最小值`}]},
{t:'16',e:`設 ${X}、${Y} 滿足 2 ≤ ${X} ≤ 6、${X} + ${Y} ≤ 10、${Y} ≥ 0，則函數 ${FX} = 3${X} − ${Y} + 5 的最大值為何？`,g:{x:[-1,11],y:[-1,11],sn:1},ans:'(C) 23',s:[
 {k:'g',t:'line',c:[1,0,2],lab:`${X} = 2`,q:`<b>繪圖（1/3）畫邊界線：</b>2 ≤ ${X} 的邊界是 ${X} = 2。這條直線上的每個點有什麼共同特徵？請在圖上點選 ${X} = 2 上的兩個點。`,h:`${X} = 2 表示每個點的橫坐標都是 2，縱坐標可以任意。`,l:`邊界 ${X} = 2 已畫出`},
 {k:'g',t:'line',c:[1,0,6],lab:`${X} = 6`,q:`再畫 ${X} ≤ 6 的邊界 ${X} = 6。請點選直線上的兩個點。`,h:`橫坐標必須是 6。`,l:`邊界 ${X} = 6 已畫出`},
 {k:'g',t:'line',c:[1,1,10],lab:`${X} + ${Y} = 10`,q:`畫 ${X} + ${Y} ≤ 10 的邊界 ${X} + ${Y} = 10。令 ${X} = 0、${Y} = 0 各得什麼點？請點選直線上的兩個點。`,h:`兩個坐標相加要等於 10，例如 (0, 10)。`,l:`邊界 ${X} + ${Y} = 10 已畫出`},
 {k:'g',t:'arrow',c:[1,0,2,'ge'],lab:`${X} ≥ 2`,q:`<b>繪圖（2/3）</b><b>用箭頭標示範圍：</b>有多個不等式時，先用箭頭記錄每個不等式的範圍，最後才找重疊處。第一個：${X} ≥ 2。請點選一個滿足 ${X} ≥ 2 的點，箭頭會從邊界線垂直指向滿足的一側。`,h:`橫坐標要大於或等於 2。`,l:`箭頭標示 ${X} ≥ 2（指向右側）`},
{k:'g',t:'arrow',c:[1,0,6,'le'],lab:`${X} ≤ 6`,q:`${X} ≤ 6。請點選一個滿足 ${X} ≤ 6 的點，箭頭會從邊界線垂直指向滿足的一側。`,h:`橫坐標要小於或等於 6。`,l:`箭頭標示 ${X} ≤ 6（指向左側）`},
{k:'g',t:'arrow',c:[1,1,10,'le'],lab:`${X} + ${Y} ≤ 10`,q:`${X} + ${Y} ≤ 10。請點選一個滿足 ${X} + ${Y} ≤ 10 的點，箭頭會從邊界線垂直指向滿足的一側。`,h:`兩個坐標相加要小於或等於 10，可以先用原點檢驗。`,l:`箭頭標示 ${X} + ${Y} ≤ 10（指向直線下方）`},
{k:'g',t:'arrow',c:[0,1,0,'ge'],lab:`${Y} ≥ 0`,q:`${Y} ≥ 0 的邊界是 ${X} 軸。請點選一個滿足 ${Y} ≥ 0 的點，箭頭會從邊界線垂直指向滿足的一側。`,h:`縱坐標要大於或等於 0。`,l:`箭頭標示 ${Y} ≥ 0（指向 ${X} 軸上方）`},
{k:'g',t:'side',cs:[[1,0,2,'ge'],[1,0,6,'le'],[1,1,10,'le'],[0,1,0,'ge']],q:`<b>找重疊處：</b>四組箭頭同時指向的區域就是可行解區域。請點選該重疊區域內的一點，圖上會塗色。`,h:`這個點要同時滿足 2 ≤ ${X} ≤ 6、${X} + ${Y} ≤ 10、${Y} ≥ 0。`,l:`重疊處塗色：可行解區域為四邊形`},
{q:`<b>繪圖（3/3）求頂點：</b>直線 ${X} = 6 與 ${X} + ${Y} = 10 的交點為 (6, ?)。? 是多少？`,k:'f',a:'4',h:`把 ${X} = 6 代入 ${X} + ${Y} = 10。`,l:`${X} = 6 與 ${X} + ${Y} = 10 交於 (6, 4)`},
 {q:`直線 ${X} = 2 與 ${X} + ${Y} = 10 的交點為 (2, ?)。? 是多少？`,k:'f',a:'8',h:`把 ${X} = 2 代入 ${X} + ${Y} = 10。`,l:`${X} = 2 與 ${X} + ${Y} = 10 交於 (2, 8)`},
 {k:'g',t:'vert',pts:[[2,0],[6,0],[6,4],[2,8]],q:`請在圖上點選可行解區域的四個頂點。（下方邊界就是 ${X} 軸，即 ${Y} = 0。）`,h:`頂點是區域邊界線的交點（轉角處）。`,l:`頂點：(2, 0)、(6, 0)、(6, 4)、(2, 8)`},
 {q:`<b>目標函數：</b>${FX} = 3${X} − ${Y} + 5。請計算 ${fv(6,0)} = ?`,k:'f',a:'23',h:`3 × 6 − 0 + 5。`,l:`${fv(6,0)} = 23`},

{t:'17',e:`上題中，函數 ${FX} = 3${X} − ${Y} + 5 的最小值為何？`,gfrom:1,ans:'(A) 3',L0:[`第 16 題的頂點：(2, 0)、(6, 0)、(6, 4)、(2, 8)`,`已算出：${fv(6,0)} = 23、${fv(2,8)} = 3`],s:[
 {q:`同一個可行解區域，只需把未計算的頂點補齊。${fv(2,0)} = ?`,k:'f',a:'11',h:`3 × 2 − 0 + 5。`,l:`${fv(2,0)} = 11`},
 {q:`${fv(6,4)} = ?`,k:'f',a:'19',h:`3 × 6 − 4 + 5。`,l:`${fv(6,4)} = 19`},
 {q:`四個頂點的值為 11、23、19、3。最小值是？`,k:'c',o:['(A) 3','(B) 4','(C) 5','(D) 6'],a:0,h:`從 11、23、19、3 中找最小的。`,l:`答案：(A) 最小值為 3，發生在 (2, 8)`}]},
{t:'18',e:`若某廣播電台播放節目 <i>A</i> 的內容 30 分鐘音樂後，隨即播放 2 分鐘廣告，聽眾有 100 萬人；播放節目 <i>B</i> 的內容 10 分鐘音樂後，隨即播放 1 分鐘廣告，聽眾有 30 萬人。今在每日播放音樂時間不超過 100 分鐘，每日至少廣告 8 分鐘的要求下，當電台每日播放 ${X} 次節目 <i>A</i>，${Y} 次節目 <i>B</i> 時，有最多聽眾 ${K} 萬人，試問：${X} + ${Y} = ？`,sm:1,g:{x:[-1,6],y:[-1,11],sn:1},ans:'(B) 6',s:[
 {q:`<b>列表 → 限制條件：</b>音樂時間每日不超過 100 分鐘。對應的不等式是？`,k:'c',o:[`30${X} + 10${Y} ≤ 100`,`30${X} + 10${Y} ≥ 100`,`2${X} + ${Y} ≤ 100`,`100${X} + 30${Y} ≤ 100`],a:0,h:`節目 <i>A</i> 的音樂 30 分鐘 × ${X} 次，節目 <i>B</i> 的音樂 10 分鐘 × ${Y} 次。「不超過」用哪個符號？`,l:`音樂：30${X} + 10${Y} ≤ 100，即 3${X} + ${Y} ≤ 10`},

const nG=()=>({lines:[],shades:[],v:[],tmp:[],t:[],arrows:[]});

const acol=(ar,G)=>{const[a,b,k]=ar.c,i=G.lines.findIndex(l=>{const[p,q,r]=l.c;return Math.abs(a*q-b*p)<1e-9&&Math.abs(a*r-k*p)<1e-9&&Math.abs(b*r-k*q)<1e-9});return i<0?'currentColor':COL[i%3]};
function segPts(g,a,b,k,n){const c=[],ok=(u,v)=>u>=g.x[0]-1e-9&&u<=g.x[1]+1e-9&&v>=g.y[0]-1e-9&&v<=g.y[1]+1e-9;
 if(b)g.x.forEach(x=>{const y=(k-a*x)/b;if(ok(x,y))c.push([x,y])});if(a)g.y.forEach(y=>{const x=(k-b*y)/a;if(ok(x,y))c.push([x,y])});
 c.sort((u,v)=>u[0]-v[0]||u[1]-v[1]);const A=c[0],B=c[c.length-1];return Array.from({length:n},(_,i)=>{const t=(i+.5)/n;return[A[0]+t*(B[0]-A[0]),A[1]+t*(B[1]-A[1])]})}
const GX=q=>q.g||P[q.gfrom].g;
const it=t=>t.replace(/<[^>]+>/g,'').replace(/[xy]/g,m=>`<tspan font-style="italic" font-family="Times New Roman,serif">${m}</tspan>`);
function clip(Pl,a,b,c,op){const sg=op=='ge'?1:-1,d=u=>sg*(a*u[0]+b*u[1]-c),o=[];
 Pl.forEach((u,i)=>{const n=Pl[(i+1)%Pl.length],du=d(u),dn=d(n);if(du>=-1e-9)o.push(u);
  if((du>1e-9&&dn<-1e-9)||(du<-1e-9&&dn>1e-9)){const t=du/(du-dn);o.push([u[0]+t*(n[0]-u[0]),u[1]+t*(n[1]-u[1])])}});return o}
function poly(g,cs){let Pl=[[g.x[0],g.y[0]],[g.x[1],g.y[0]],[g.x[1],g.y[1]],[g.x[0],g.y[1]]];cs.forEach(c=>Pl=clip(Pl,...c));return Pl}
function gfull(j){const G=nG(),g=P[j].g;P[j].s.forEach(st=>{if(st.k!='g')return;if(st.t=='line')G.lines.push(st);if(st.t=='arrow'){if(st.clear)G.shades=[];G.arrows.push(st)}if(st.t=='side')G.shades.push(poly(g,st.cs));if(st.t=='vert')G.v.push(...st.pts)});return G}
function gsvg(g,G,act){
 const xr=g.x[1]-g.x[0],yr=g.y[1]-g.y[0],px=x=>M.l+(x-g.x[0])/xr*PW,py=y=>M.t+PH-(y-g.y[0])/yr*PH;

 G.shades.forEach(Pl=>o+=`<polygon points="${Pl.map(u=>px(u[0])+','+py(u[1])).join(' ')}" fill="#2f5bea" fill-opacity=".2"/>`);

  segPts(g,a,b,k,5).forEach(u=>{const X0=px(u[0]),Y0=py(u[1]),X1=X0+24*dx,Y1=Y0+24*dy,hx=X1-7*dx,hy=Y1-7*dy;o+=`<line x1="${X0}" y1="${Y0}" x2="${hx}" y2="${hy}" stroke="${cl}" stroke-width="2.2"/><polygon points="${X1},${Y1} ${hx-3.5*dy},${hy+3.5*dx} ${hx+3.5*dy},${hy-3.5*dx}" fill="${cl}"/>`})});

  G.arrows.forEach(ar=>row(ar.lab,acol(ar,G)))}

 G.tmp.concat(G.t).forEach(u=>o+=`<circle cx="${px(u[0])}" cy="${py(u[1])}" r="4.5" fill="#2f5bea"/>`);
 G.v.forEach(u=>{const cx=px(u[0]),cy=py(u[1]);o+=`<circle cx="${cx}" cy="${cy}" r="6" fill="#1b8a4b" stroke="#fff" stroke-width="1.5"/><text class="gt" style="fill:var(--ink);font-size:13px" x="${cx+(cx>W-90?-9:9)}" y="${cy-8}" text-anchor="${cx>W-90?'end':'start'}">(${u[0]}, ${u[1]})</text>`});
 if(act)o+=`<rect x="${M.l-6}" y="${M.t-6}" width="${PW+12}" height="${PH+12}" fill="transparent" onpointerdown="gtap(event)"/>`;

function gtap(ev){
 const s=S[p],q=P[p],st=q.s[s.i],g=q.g;if(s.ok)return;
 const sv=ev.target.ownerSVGElement,pt=sv.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const c=pt.matrixTransform(sv.getScreenCTM().inverse());
 const sn=g.sn;let x=g.x[0]+(c.x-M.l)/PW*(g.x[1]-g.x[0]),y=g.y[0]+(M.t+PH-c.y)/PH*(g.y[1]-g.y[0]);
 x=Math.min(g.x[1],Math.max(g.x[0],Math.round(x/sn)*sn));y=Math.min(g.y[1],Math.max(g.y[0],Math.round(y/sn)*sn));
 const G=s.G,eq=(u,v)=>Math.abs(u[0]-v[0])<1e-6&&Math.abs(u[1]-v[1])<1e-6;
 if(st.t=='line'){const[a,b,k]=st.c;if(Math.abs(a*x+b*y-k)>1e-6){bad();return}
  if(G.tmp.some(u=>eq(u,[x,y]))){s.cls='no';s.fb='請選擇另一個不同的點。';render();return}
  G.tmp.push([x,y]);if(G.tmp.length==2){G.lines.push(st);G.tmp=[];good()}else{s.cls='';s.fb='已選第 1 點，請再選第 2 個點。';render()}}
 if(st.t=='arrow'){const[a,b,k,op]=st.c;if(op=='ge'?a*x+b*y>=k-1e-9:a*x+b*y<=k+1e-9){if(st.clear)G.shades=[];G.arrows.push(st);good()}else bad()}
 if(st.t=='side'){if(st.cs.every(([a,b,k,op])=>op=='ge'?a*x+b*y>=k-1e-9:a*x+b*y<=k+1e-9)){G.shades.push(poly(g,st.cs));G.t.push([x,y]);good()}else bad()}
 if(st.t=='vert'){const m=st.pts.find(u=>eq(u,[x,y]));if(m&&!G.v.some(u=>eq(u,m))){G.v.push(m);if(G.v.length==st.pts.length)good();else{s.cls='';s.fb=`已標出 ${G.v.length} / ${st.pts.length} 個頂點。`;render()}}else bad()}
}
function render(){
 const q=P[p],s=S[p],st=q.s[s.i];
 $('tabs').innerHTML='<h1>1-3 線性規劃</h1>'+P.map((o,j)=>`<button class="tab${j==p?' on':''}${S[j].d?' dn':''}" onclick="go(${j})">${o.t}</button>`).join('');
 $('prob').className='card'+(q.sm?' sm':'');
 $('prob').innerHTML=`<div class="lab">${p?'第 '+q.t+' 題':'先備重點'}</div>${q.e}`;
 const bd=$('board'),oldTop=bd.scrollTop||0,grew=s.L.length>(s.pn||0);
 bd.className='card'+(s.L.length>7?' cp':'');
 bd.innerHTML=`<div class="lab">我的解題紀錄（共 ${s.L.length} 項，可上下滑動）</div>`+s.L.map(l=>`<div class="ln">${l}</div>`).join('');
 bd.scrollTop=grew?bd.scrollHeight:oldTop;s.pn=s.L.length;
 let a='';
 if(s.d){$('q').innerHTML=`<div class="lab">完成</div><span class="big">${q.ans}</span><br>回頭看左側紀錄與圖形，每一步的依據是什麼？`;
  const j=q.gfrom!=null?q.gfrom:p;a=gsvg(GX(q),gfull(j),0)+(p<P.length-1?`<button class="go" onclick="go(${p+1})">${p?'前往下一題':'開始第 16 題'}</button>`:'');}
 else{
  $('q').innerHTML=`<div class="lab">步驟 ${s.i+1} / ${q.s.length}　${st.k=='g'?'動手畫圖':'思考一下'}</div>${st.q}`;
  const dis=s.ok?'disabled':'';
  if(st.k=='g')a=gsvg(q.g,s.G,1);
  if(st.k=='c')a=`<div class="opts">${st.o.map((o,j)=>`<button class="opt${s.ok&&j==st.a?' good':''}" ${dis} onclick="pick(${j})">${o}</button>`).join('')}</div>`;
  if(st.k=='f')a=`<div id="disp">${s.buf.replace('-','−')||'&nbsp;'}</div><div class="pad">${['7','8','9','4','5','6','1','2','3','−','0','⌫'].map(k=>`<button ${dis} onclick="key('${k}')">${k}</button>`).join('')}</div><button class="go" ${dis} onclick="chk()">確認</button>`;
  if(st.k=='o')a=`<div id="disp" style="font-size:1.05em">${s.ord.map(k=>st.o[k]).join(st.sep)||'&nbsp;'}</div><div class="opts" style="grid-template-columns:repeat(3,1fr)">${Object.keys(st.o).map(k=>`<button class="opt" ${dis||(s.ord.includes(k)?'disabled':'')} onclick="ord('${k}')">${st.o[k]}</button>`).join('')}</div><button class="go" style="background:var(--card);color:var(--ink)" ${dis} onclick="S[p].ord=[];S[p].fb='';S[p].cls='';render()">重選</button>`;
  if(s.ok)a+=`<button class="go" onclick="nxt()">${s.i==q.s.length-1?'完成':'下一步'}</button>`;
 }
 $('act').innerHTML=a;$('fb').className=s.cls;$('fb').innerHTML=s.fb;
}
function good(){const s=S[p],st=P[p].s[s.i];s.ok=1;s.cls='ok';s.fb='<b>正確。</b>';s.L.push(st.l);render()}
function bad(){const s=S[p],st=P[p].s[s.i];s.cls='no';s.fb=`<b>再想想。</b>${st.h}`;s.ord=[];s.buf='';s.G.tmp=[];render()}
function pick(j){P[p].s[S[p].i].a==j?good():bad()}
function key(k){const s=S[p];if(k=='⌫')s.buf=s.buf.slice(0,-1);else if(s.buf.length<4)s.buf+=(k=='−'?'-':k);s.fb='';s.cls='';render()}
function chk(){const s=S[p];s.buf.replace('−','-')==P[p].s[s.i].a?good():bad()}
function ord(k){const s=S[p],st=P[p].s[s.i];s.ord.push(k);if(s.ord.length==Object.keys(st.o).length){st.a.join()==s.ord.join()?good():bad()}else render()}
function nxt(){const s=S[p];if(s.i==P[p].s.length-1){s.d=1;s.fb='';s.cls=''}else{s.i++;s.ok=0;s.fb='';s.cls='';s.buf='';s.ord=[]}render()}
function go(j){p=j;render()}
render();
</script></body></html>
