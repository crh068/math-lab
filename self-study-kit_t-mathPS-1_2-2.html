<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2-2 度量的應用 互動學具</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--mut:#5d6679;--ac:#2f5bea;--acl:#e6ecff;--ok:#1b8a4b;--okl:#e3f6ea;--bad:#c2410c;--badl:#fff0e6;--hn:#7a5b00;--hnl:#fff8dc;--bd:#d5dbe8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141824;--card:#1f2535;--ink:#eef1f8;--mut:#9aa4bb;--ac:#7b9bff;--acl:#2a3558;--ok:#5fd58f;--okl:#173626;--bad:#ffa066;--badl:#3d2415;--hn:#ffd666;--hnl:#3a3217;--bd:#39425a}}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:max(2.4vh,13px);display:flex;flex-direction:column;padding:1.2vh 1.6vw;gap:1.2vh}
#tabs{display:flex;gap:.7vw;align-items:center;height:7vh;flex:none}
#tabs h1{font-size:1.1em;margin:0 1vw 0 0;white-space:nowrap}
.tab{flex:none;min-width:6vh;height:6vh;padding:0 1.6vh;border-radius:3vh;border:2px solid var(--bd);background:var(--card);color:var(--ink);font-size:1em;font-weight:700}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}.tab.dn{border-color:var(--ok);color:var(--ok)}.tab.on.dn{background:var(--ok);color:#fff}
#main{flex:1;min-height:0;display:grid;grid-template-columns:1.05fr 1fr;gap:1.6vw}
.col{display:flex;flex-direction:column;gap:1.2vh;min-height:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:1.6vh 1.4vw}
.lab{font-size:.72em;color:var(--mut);font-weight:700;margin-bottom:.8vh}
#prob{flex:none;font-size:1.05em;line-height:1.8;max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#prob.sm{font-size:.9em;line-height:1.65}
#board{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;font-size:1.05em}
#board.cp{font-size:.92em}
#board .lab{position:sticky;top:-1.6vh;background:var(--card);padding:.4vh 0 .8vh;margin:0;z-index:1}
#board .ln{padding:.4vh 0;border-bottom:1px dashed var(--bd);line-height:1.8}
#q{flex:none;font-size:1.05em;line-height:1.75;min-height:13vh;max-height:30vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#q .lab{margin-bottom:1.2vh}
#act{flex:1;min-height:0;display:flex;flex-direction:column;gap:1vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.2vh 1vw}
.col2{display:flex;flex-direction:column;gap:1.1vh}
.opt{border:2px solid var(--bd);background:var(--card);color:var(--ink);border-radius:12px;font-size:1em;min-height:8vh;padding:.6vh .8vw;line-height:1.4}
.opt:active{background:var(--acl);border-color:var(--ac)}.opt:disabled{opacity:.5}
.opt.good{background:var(--okl);border-color:var(--ok);opacity:1}.opt.sel{border-color:var(--ac);background:var(--acl)}
#disp{border:2px solid var(--ac);border-radius:12px;font-size:1.4em;text-align:center;min-height:7vh;line-height:7vh;background:var(--card)}
#disp small{font-size:.65em;color:var(--mut);margin-left:.5em}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.8vh .6vw}
.pad button,.go{border:2px solid var(--bd);background:var(--card);color:var(--ink);border-radius:10px;font-size:1.3em;height:6.2vh}
.go{background:var(--ac);color:#fff;border-color:var(--ac);font-size:1.05em;font-weight:700;width:100%}
#fb{flex:none;min-height:9vh;border-radius:12px;padding:1vh 1vw;line-height:1.7;font-size:.95em}
#fb.ok{background:var(--okl);border-left:5px solid var(--ok)}#fb.no{background:var(--badl);border-left:5px solid var(--bad)}#fb.hn{background:var(--hnl);border-left:5px solid var(--hn)}
#fb:empty{visibility:hidden}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nvr{display:flex;justify-content:space-between;align-items:center;gap:1vw}.nvr>span:last-child{display:flex}
.nv{border:1.5px solid var(--bd);background:var(--card);color:var(--ink);border-radius:8px;font-size:1.25em;font-weight:600;padding:.3vh 1vw;min-height:4.4vh;margin-left:.6vw;white-space:nowrap}.nv:disabled{opacity:.3}
.big{font-size:1.4em;font-weight:700;color:var(--ok)}
.tb{border-collapse:collapse;font-size:.8em;line-height:1.3;flex:1}.tb td,.tb th{border:1px solid var(--bd);padding:.2vh .8vw;text-align:center}.tb th{background:var(--acl)}
sup{font-size:.65em;line-height:0}
#cele{display:none}#cele.on{display:flex;position:fixed;inset:0;z-index:50;background:rgba(10,15,30,.55);align-items:center;justify-content:center;padding:3vh 3vw}
#cele .box{background:var(--card);color:var(--ink);border:1px solid var(--bd);border-radius:18px;padding:3vh 3vw;max-width:78vw;max-height:92vh;overflow:auto;text-align:center}
#cele h2{margin:0 0 1vh;font-size:2.1em;color:var(--ok)}#cele p{margin:.6vh 0 1.6vh;color:var(--mut)}
#cele .gr{display:grid;grid-template-columns:1fr 1fr;gap:.9vh 1.2vw;text-align:left;margin-bottom:2vh}
#cele .it{border:1px solid var(--bd);border-radius:10px;padding:.8vh 1vw;background:var(--okl)}
#cele .bt{display:flex;gap:1.2vw}#cele .bt button{flex:1;border:2px solid var(--ac);background:var(--card);color:var(--ink);border-radius:12px;font-size:1.05em;min-height:6.4vh;font-weight:700}#cele .bt button.pri{background:var(--ac);color:#fff}
</style></head>
<body>
<div id="tabs"></div>
<div id="cele"></div>
<div id="main">
 <div class="col"><div class="card" id="prob"></div><div class="card" id="board"></div></div>
 <div class="col"><div class="card" id="q"></div><div id="act"></div><div id="fb"></div></div>
</div>

const mkS=()=>P.map(()=>({v:null,snap:{},i:0,L:[],d:0,fb:'',cls:'',ok:0,buf:'',ord:[],mt:null,pr:{},hl:0,pn:0}));
let S=mkS(),p=0,cele=0;
const $=id=>document.getElementById(id);
const fcur=()=>{const s=S[p];return s.d?P[p].s.length:s.i};
const U=st=>st.u?`<small>${st.u}</small>`:'';
function NAV(label){const s=S[p],st=P[p].s[s.i],cur=s.v==null&&!s.d&&!s.ok&&(P[p].s[s.i].h||[]).length,bk=(s.v==null?fcur():s.v)<=0;
 return `<div class="lab nvr"><span>${label}</span><span>${cur?'<button class="nv" onclick="hint()">💡 提示</button>':''}<button class="nv" ${bk?'disabled':''} onclick="back()">‹ 上一步</button><button class="nv" ${s.v==null?'disabled':''} onclick="fwd()">下一步 ›</button></span></div>`}
function back(){const s=S[p],v=(s.v==null?fcur():s.v)-1;if(v>=0){s.v=v;render()}}
function fwd(){const s=S[p];if(s.v==null)return;const v=s.v+1;s.v=v>=fcur()?null:v;render()}
function toCur(){S[p].v=null;render()}
function rev(st){let a='';
 if(st.k=='c')a=`<div class="opts">${st.o.map((o,k)=>`<button class="opt${k==st.a?' good':''}" disabled>${o}</button>`).join('')}</div>`;
 if(st.k=='f')a=`<div id="disp">${st.a}${U(st)}</div>`;
 if(st.k=='o')a=`<div id="disp" style="font-size:1.05em">${st.a.map(k=>st.o[k]).join(st.sep)}</div>`;
 if(st.k=='m')a=`<div class="opts" style="align-items:start"><div class="col2">${st.L.map(o=>`<button class="opt good" disabled>${o}</button>`).join('')}</div><div class="col2">${st.R.map(o=>`<button class="opt good" disabled>${o}</button>`).join('')}</div></div>`;
 return a+`<button class="go" onclick="toCur()">回到目前步驟</button>`}
function showCele(){const el=$('cele');if(cele!=1){el.className='';el.innerHTML='';return}
 el.className='on';el.innerHTML=`<div class="box"><h2>🎉 恭喜完成！</h2><p>「重點整理」與第 1–7 題的每個步驟都已完成。</p><div class="gr">${P.map((q,j)=>`<div class="it"><b>${j?'第 '+q.t+' 題':'重點整理'}</b>　${j?q.ans:'已完成'}</div>`).join('')}</div><div class="bt"><button onclick="cele=2;render()">回顧解題過程</button><button class="pri" onclick="S=mkS();p=0;cele=0;render()">重新練習</button></div></div>`}
function render(){
 const q=P[p],s=S[p],st=q.s[s.i];
 $('tabs').innerHTML='<h1>2-2 度量的應用</h1>'+P.map((o,j)=>`<button class="tab${j==p?' on':''}${S[j].d?' dn':''}" onclick="go(${j})">${o.t}</button>`).join('')+(S.every(x=>x.d)?'<button class="tab" style="margin-left:auto" onclick="cele=1;render()">🎉 完成</button>':'');
 $('prob').className='card'+(q.sm?' sm':'');
 $('prob').innerHTML=`<div class="lab">${p?'第 '+q.t+' 題':'先備重點'}</div>${q.e}${q.fig||''}`;
 const bd=$('board'),oldTop=bd.scrollTop||0,grew=s.L.length>s.pn;
 bd.className='card'+(s.L.length>7?' cp':'');
 bd.innerHTML=`<div class="lab">我的解題紀錄（共 ${s.L.length} 項，可上下滑動）</div>`+s.L.map(l=>`<div class="ln">${l}</div>`).join('');
 bd.scrollTop=grew?bd.scrollHeight:oldTop;s.pn=s.L.length;
 if(s.v!=null){const sj=q.s[s.v];$('q').innerHTML=`${NAV(`回顧　步驟 ${s.v+1} / ${q.s.length}（已完成）`)}${sj.q}`;$('act').innerHTML=rev(sj);$('fb').className='ok';$('fb').innerHTML=`<b>解題依據：</b>${sj.l}`;showCele();return}
 let a='';
 if(s.d){$('q').innerHTML=`${NAV('完成')}<span class="big">${q.ans}</span><br>回頭看左側紀錄，每一步的算法和依據是什麼？`;
  a=p<P.length-1?`<button class="go" onclick="go(${p+1})">${p?'前往下一題':'開始第 1 題'}</button>`:'';}
 else{
  $('q').innerHTML=`${NAV(`步驟 ${s.i+1} / ${q.s.length}　${st.k=='f'?'動手算一算':st.k=='m'?'配對':'思考一下'}`)}${st.q}`;
  const dis=s.ok?'disabled':'';
  if(st.k=='c')a=`<div class="opts">${st.o.map((o,j)=>`<button class="opt${s.ok&&j==st.a?' good':''}" ${dis} onclick="pick(${j})">${o}</button>`).join('')}</div>`;
  if(st.k=='f')a=`<div id="disp">${s.buf||'&nbsp;'}${U(st)}</div><div class="pad">${['7','8','9','4','5','6','1','2','3','.','0','⌫'].map(k=>`<button ${dis} onclick="key('${k}')">${k}</button>`).join('')}</div><button class="go" ${dis} onclick="chk()">確認</button>`;
  if(st.k=='m')a=`<div class="opts" style="align-items:start"><div class="col2">${st.L.map((o,i)=>`<button class="opt${s.pr[i]?' good':s.mt===i?' sel':''}" ${s.pr[i]?'disabled':''} onclick="mL(${i})">${o}</button>`).join('')}</div><div class="col2">${st.sh.map(j=>`<button class="opt${s.pr[j]?' good':''}" ${s.pr[j]?'disabled':''} onclick="mR(${j})">${st.R[j]}</button>`).join('')}</div></div>`;
  if(st.k=='o')a=`<div id="disp" style="font-size:1.05em">${s.ord.map(k=>st.o[k]).join(st.sep)||'&nbsp;'}</div><div class="opts">${Object.keys(st.o).map(k=>`<button class="opt" ${dis||(s.ord.includes(k)?'disabled':'')} onclick="ord('${k}')">${st.o[k]}</button>`).join('')}</div><button class="go" style="background:var(--card);color:var(--ink)" ${dis} onclick="S[p].ord=[];S[p].fb='';S[p].cls='';render()">重選</button>`;
  if(s.ok)a+=`<button class="go" onclick="nxt()">${s.i==q.s.length-1?'完成':'下一步'}</button>`;
 }
 $('act').innerHTML=a;$('fb').className=s.cls;$('fb').innerHTML=s.fb;showCele();
}
const HT=(st,s)=>{const h=st.h||[];return h[Math.min(s.hl-1,h.length-1)]||''};
function good(){const s=S[p],st=P[p].s[s.i];s.ok=1;s.cls='ok';s.fb='<b>正確。</b>';s.L.push(st.l);render()}
function bad(){const s=S[p],st=P[p].s[s.i];s.hl++;s.cls='no';s.fb=`<b>再想想。</b>${HT(st,s)}`;s.buf='';s.mt=null;s.ord=[];render()}
function hint(){const s=S[p],st=P[p].s[s.i];if(s.ok||s.v!=null)return;s.hl++;s.cls='hn';s.fb=`<b>💡 提示：</b>${HT(st,s)}`;render()}
function pick(j){P[p].s[S[p].i].a==j?good():bad()}
function key(k){const s=S[p];if(k=='⌫')s.buf=s.buf.slice(0,-1);else if(s.buf.length<8&&!(k=='.'&&(s.buf.includes('.')||!s.buf)))s.buf+=k;s.fb='';s.cls='';render()}
function chk(){const s=S[p],st=P[p].s[s.i],v=parseFloat(s.buf);if(s.buf&&Math.abs(v-st.a)<1e-9)good();else bad()}
function mL(i){const s=S[p];s.mt=i;s.fb='';s.cls='';render()}
function mR(j){const s=S[p],st=P[p].s[s.i];if(s.mt===null){s.cls='';s.fb='請先點選左側的項目。';render();return}
 if(s.mt===j){s.pr[j]=1;s.mt=null;s.fb='';s.cls='';if(Object.keys(s.pr).length==st.L.length)good();else render()}else bad()}
function ord(k){const s=S[p],st=P[p].s[s.i];s.ord.push(k);if(s.ord.length==Object.keys(st.o).length){st.a.join()==s.ord.join()?good():bad()}else render()}
function nxt(){const s=S[p];s.hl=0;if(s.i==P[p].s.length-1){s.d=1;s.fb='';s.cls='';if(S.every(x=>x.d))cele=1}else{s.i++;s.ok=0;s.fb='';s.cls='';s.buf='';s.mt=null;s.ord=[];s.pr={}}render()}
function go(j){p=j;render()}
render();
</script></body></html>
