<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3-1 直角坐標 互動學具</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--mut:#5d6679;--ac:#2f5bea;--acl:#e6ecff;--ok:#1b8a4b;--okl:#e3f6ea;--bad:#c2410c;--badl:#fff0e6;--hn:#7a5b00;--hnl:#fff8dc;--bd:#d5dbe8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141824;--card:#1f2535;--ink:#eef1f8;--mut:#9aa4bb;--ac:#7b9bff;--acl:#2a3558;--ok:#5fd58f;--okl:#173626;--bad:#ffa066;--badl:#3d2415;--hn:#ffd666;--hnl:#3a3217;--bd:#39425a}}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:max(2.4vh,13px);display:flex;flex-direction:column;padding:1.2vh 1.6vw;gap:1.2vh}
#tabs{display:flex;gap:.45vw;align-items:center;height:7vh;flex:none;overflow-x:auto;-webkit-overflow-scrolling:touch}
#tabs h1{font-size:1.1em;margin:0 1vw 0 0;white-space:nowrap}
.tab{flex:none;min-width:4.8vh;height:5.6vh;padding:0 1.1vh;border-radius:3vh;border:2px solid var(--bd);background:var(--card);color:var(--ink);font-size:1em;font-weight:700}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}.tab.dn{border-color:var(--ok);color:var(--ok)}.tab.on.dn{background:var(--ok);color:#fff}
#main{flex:1;min-height:0;display:grid;grid-template-columns:1.05fr 1fr;gap:1.6vw}
.col{display:flex;flex-direction:column;gap:1.2vh;min-height:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:1.6vh 1.4vw}
.lab{font-size:.72em;color:var(--mut);font-weight:700;margin-bottom:.8vh}
#prob{flex:none;font-size:1.05em;line-height:1.8;max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#prob.sm{font-size:.9em;line-height:1.65}
#board{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;font-size:1.05em}
#board.cp{font-size:.92em}
#board .lab{position:sticky;top:-1.6vh;background:var(--card);padding:.4vh 0 .8vh;margin:0;z-index:1}
#board .ln{padding:.4vh 0;border-bottom:1px dashed var(--bd);line-height:1.8}
#q{flex:none;font-size:1.05em;line-height:1.75;min-height:13vh;max-height:30vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#q .lab{margin-bottom:1.2vh}
#act{flex:1;min-height:0;display:flex;flex-direction:column;gap:1vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.2vh 1vw}
.col2{display:flex;flex-direction:column;gap:1.1vh}
.opt{border:2px solid var(--bd);background:var(--card);color:var(--ink);border-radius:12px;font-size:1em;min-height:8vh;padding:.6vh .8vw;line-height:1.4}
.opt:active{background:var(--acl);border-color:var(--ac)}.opt:disabled{opacity:.5}
.opt.good{background:var(--okl);border-color:var(--ok);opacity:1}.opt.sel{border-color:var(--ac);background:var(--acl)}
#disp{border:2px solid var(--ac);border-radius:12px;font-size:1.4em;text-align:center;min-height:7vh;line-height:7vh;background:var(--card)}
#disp small{font-size:.65em;color:var(--mut);margin-left:.5em}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:.8vh .6vw}.pad button:nth-child(13){grid-column:span 2}.pad button:disabled{opacity:.3}
.pad button,.go{border:2px solid var(--bd);background:var(--card);color:var(--ink);border-radius:10px;font-size:1.3em;height:6.2vh}
.go{background:var(--ac);color:#fff;border-color:var(--ac);font-size:1.05em;font-weight:700;width:100%}
#fb{flex:none;min-height:9vh;border-radius:12px;padding:1vh 1vw;line-height:1.7;font-size:.95em}
#fb.ok{background:var(--okl);border-left:5px solid var(--ok)}#fb.no{background:var(--badl);border-left:5px solid var(--bad)}#fb.hn{background:var(--hnl);border-left:5px solid var(--hn)}
#fb:empty{visibility:hidden}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nvr{display:flex;justify-content:space-between;align-items:center;gap:1vw}.nvr>span:last-child{display:flex}
.nv{border:1.5px solid var(--bd);background:var(--card);color:var(--ink);border-radius:8px;font-size:1.25em;font-weight:600;padding:.3vh 1vw;min-height:4.4vh;margin-left:.6vw;white-space:nowrap}.nv:disabled{opacity:.3}
.big{font-size:1.4em;font-weight:700;color:var(--ok)}
.tb{border-collapse:collapse;font-size:.8em;line-height:1.3;flex:1}.tb td,.tb th{border:1px solid var(--bd);padding:.2vh .8vw;text-align:center}.tb th{background:var(--acl)}
sup{font-size:.65em;line-height:0;vertical-align:baseline;position:relative;top:-.6em}sub{font-size:.65em;line-height:0;vertical-align:baseline;position:relative;top:.3em}
i{font-family:"Times New Roman","Noto Serif TC",serif}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 .1em}.fr>span:first-child{border-bottom:.09em solid currentColor;padding:0 .18em .06em}.fr>span:last-child{padding:.06em .18em 0}
.ol{text-decoration:overline;text-decoration-thickness:1px}
.rt{display:inline-block;position:relative;padding:.34em .12em 0 .85em;margin:0 .06em;line-height:1.25}.rt>svg{position:absolute;left:0;top:0;width:.85em;height:100%;overflow:visible}.rt::before{content:'';position:absolute;left:.78em;right:0;top:0;height:1.5px;background:currentColor;transform:translateY(-50%)}.rt .ri{position:absolute;left:.04em;font-size:.55em;line-height:1;padding:0;margin:0;top:.26em}
.gl{stroke:var(--bd);stroke-width:1}.ga{stroke:var(--ink);stroke-width:1.8}.gf{fill:var(--ink)}.gt{fill:var(--mut);font-size:12px}.gd{fill:var(--mut);opacity:.45}
#cele{display:none}#cele.on{display:flex;position:fixed;inset:0;z-index:50;background:rgba(10,15,30,.55);align-items:center;justify-content:center;padding:3vh 3vw}
#cele .box{background:var(--card);color:var(--ink);border:1px solid var(--bd);border-radius:18px;padding:3vh 3vw;max-width:78vw;max-height:92vh;overflow:auto;text-align:center}
#cele h2{margin:0 0 1vh;font-size:2.1em;color:var(--ok)}#cele p{margin:.6vh 0 1.6vh;color:var(--mut)}
#cele .gr{display:grid;grid-template-columns:1fr 1fr;gap:.9vh 1.2vw;text-align:left;margin-bottom:2vh}
#cele .it{border:1px solid var(--bd);border-radius:10px;padding:.8vh 1vw;background:var(--okl)}
#cele .bt{display:flex;gap:1.2vw}#cele .bt button{flex:1;border:2px solid var(--ac);background:var(--card);color:var(--ink);border-radius:12px;font-size:1.05em;min-height:6.4vh;font-weight:700}#cele .bt button.pri{background:var(--ac);color:#fff}
</style></head>
<body>
<div id="tabs"></div>
<div id="cele"></div>
<div id="main">
 <div class="col"><div class="card" id="prob"></div><div class="card" id="board"></div></div>
 <div class="col"><div class="card" id="q"></div><div id="act"></div><div id="fb"></div></div>
</div>
<script>
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const MX=(w,n,d)=>`${w}${F(n,d)}`;
const R=(n,x)=>`<span class="rt">${n?`<span class="ri">${n}</span>`:''}<svg viewBox="0 0 12 20" preserveAspectRatio="none"><path d="M1.2,12.8 L3.2,11.4 L6.2,19.2 L11.8,0" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="miter" stroke-linecap="square"/></svg>${x}</span>`;
const H=(...a)=>a;
const V=s=>`<i>${s}</i>`;
const OL=s=>`<span class="ol">${s}</span>`;
const SQ=(b,e)=>`${b}<sup>${e}</sup>`;
const x_=V('x'),y_=V('y'),a_=V('a'),b_=V('b'),c_=V('c'),d_=V('d');
/* ---- 數線與坐標平面繪圖 ---- */
const NLd={W:480,H:150,l:24,r:40,y0:80};NLd.pw=NLd.W-NLd.l-NLd.r;
function NL(g,pts,act){const{W,H,l,y0,pw}=NLd,[lo,hi]=g.v,sub=g.sub||1,px=v=>l+(v-lo)/(hi-lo)*pw,e=W-NLd.r;
 let o=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;flex:none;max-height:24vh;background:var(--card);border:1px solid var(--bd);border-radius:12px;touch-action:manipulation;user-select:none;color:var(--ink)"><line x1="${l-8}" y1="${y0}" x2="${e+20}" y2="${y0}" stroke="currentColor" stroke-width="2"/><polygon points="${e+32},${y0} ${e+19},${y0-5.5} ${e+19},${y0+5.5}" fill="currentColor"/>`;
 for(let k=Math.ceil(lo*sub-1e-9);k<=Math.floor(hi*sub+1e-9);k++){const v=k/sub,it=k%sub===0;o+=`<line x1="${px(v)}" y1="${y0-(it?10:5)}" x2="${px(v)}" y2="${y0+(it?10:5)}" stroke="currentColor" stroke-width="${it?2:1.2}"/>`;if(it)o+=`<text x="${px(v)}" y="${y0+30}" text-anchor="middle" font-size="16" fill="currentColor">${String(v).replace('-','−')}</text>`}
 if(lo<=0&&hi>=0)o+=`<text x="${px(0)}" y="${y0-18}" text-anchor="middle" font-size="15" font-style="italic" font-family="Times New Roman,serif" fill="currentColor">O</text>`;
 pts.forEach(p=>o+=`<circle cx="${px(p.v)}" cy="${y0}" r="6" fill="#d8352a"/><text x="${px(p.v)}" y="${y0-14}" text-anchor="middle" font-size="16" font-style="italic" font-family="Times New Roman,serif" fill="#d8352a">${p.l||''}</text>`);
 if(act)o+=`<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" onpointerdown="ntap(event)"/>`;
 return o+'</svg>'}
const CPd={W:480,H:400,m:24};
function CPg(g){const{W,H,m}=CPd,xr=g.x[1]-g.x[0],yr=g.y[1]-g.y[0],u=Math.min((W-2*m)/xr,(H-2*m)/yr),ox=(W-u*xr)/2,oy=(H-u*yr)/2;return{u,ox,oy,px:x=>ox+(x-g.x[0])*u,py:y=>H-oy-(y-g.y[0])*u}}
function CP(g,pts,act){const{W,H}=CPd,{u,ox,oy,px,py}=CPg(g);
 let o=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;flex:1;min-height:0;background:var(--card);border:1px solid var(--bd);border-radius:12px;touch-action:manipulation;user-select:none;color:var(--ink)">`;
 for(let i=g.x[0];i<=g.x[1];i++){o+=`<line class="gl" x1="${px(i)}" y1="${py(g.y[0])}" x2="${px(i)}" y2="${py(g.y[1])}"/>`;if(i)o+=`<text class="gt" x="${px(i)}" y="${py(0)+15}" text-anchor="middle">${String(i).replace('-','−')}</text>`}
 for(let i=g.y[0];i<=g.y[1];i++){o+=`<line class="gl" x1="${px(g.x[0])}" y1="${py(i)}" x2="${px(g.x[1])}" y2="${py(i)}"/>`;if(i)o+=`<text class="gt" x="${px(0)-6}" y="${py(i)+4}" text-anchor="end">${String(i).replace('-','−')}</text>`}
 const ax=px(g.x[1])+14,ay=py(g.y[1])-14;
 o+=`<line class="ga" x1="${px(g.x[0])}" y1="${py(0)}" x2="${ax-3}" y2="${py(0)}"/><line class="ga" x1="${px(0)}" y1="${py(g.y[0])}" x2="${px(0)}" y2="${ay+3}"/><polygon class="gf" points="${ax},${py(0)} ${ax-10},${py(0)-4.5} ${ax-10},${py(0)+4.5}"/><polygon class="gf" points="${px(0)},${ay} ${px(0)-4.5},${ay+10} ${px(0)+4.5},${ay+10}"/>`;
 o+=`<text class="gt" style="font-size:15px;fill:var(--ink)" font-style="italic" font-family="Times New Roman,serif" x="${ax-2}" y="${py(0)+20}">x</text><text class="gt" style="font-size:15px;fill:var(--ink)" font-style="italic" font-family="Times New Roman,serif" x="${px(0)+9}" y="${ay+8}">y</text><text class="gt" style="font-size:13px;fill:var(--ink)" font-style="italic" font-family="Times New Roman,serif" x="${px(0)-15}" y="${py(0)+15}">O</text>`;
 if(act)for(let x=g.x[0];x<=g.x[1];x++)for(let y=g.y[0];y<=g.y[1];y++)o+=`<circle cx="${px(x)}" cy="${py(y)}" r="1.5" class="gd"/>`;
 pts.forEach(p=>o+=`<circle cx="${px(p.x)}" cy="${py(p.y)}" r="5.5" fill="#d8352a" stroke="#fff" stroke-width="1.2"/><text x="${px(p.x)+8}" y="${py(p.y)-8}" font-size="15" font-style="italic" font-family="Times New Roman,serif" fill="#d8352a">${p.l||''}</text>`);
 if(act)o+=`<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" onpointerdown="ctap(event)"/>`;
 return o+'</svg>'}
