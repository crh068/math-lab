()=>{const n=pk([3,4,5]);return{q:`${rt(n,'a')} = a^{1/□}`,a:String(n),w:`a^{1/n} = ⟦n|a⟧，這裡 n = ${n}。`}}],
od:[
{title:'推導：定義 a^{1/n}',steps:['由指數律：(a^{1/n})^{n} = a^{(1/n)×n}','= a^{1} = a','所以 a^{1/n} 是方程式 x^{n} = a 的根，而 x^{n} = a 恰有一正實數根 ⟦n|a⟧','因此定義 a^{1/n} = ⟦n|a⟧']},
{title:'推導：定義 a^{m/n}',steps:['(a^{m/n})^{n} = a^{(m/n)×n}','= a^{m}','所以 a^{m/n} 為 a^{m} 的正 n 次方根','即 a^{m/n} = ⟦n|a^{m}⟧']}]},
/* ───────── 2-1.4 ───────── */
{k:'2-1.4 實數指數',ic:'🏆',
info:'當 a > 0，x 為實數時，a^{x} 都可定義，且都滿足指數律（證明超出教材範圍，這一單元只要熟習指數律）。設 a、b 為正實數，m、n 為實數：(1) a^{m}×a^{n} = a^{m+n}　(2) a^{m}÷a^{n} = a^{m−n}　(3) (a^{m})^{n} = a^{mn}　(4) (ab)^{n} = a^{n}×b^{n}　(5) (a/b)^{n} = ~{a^n|b^n}。',
cards:[['指數律 (1)','a^{m}×a^{n} = a^{m+n}'],['指數律 (2)','a^{m}÷a^{n} = a^{m−n}'],['指數律 (3)','(a^{m})^{n} = a^{mn}'],['指數律 (4)','(ab)^{n} = a^{n}×b^{n}'],['指數律 (5)','(a/b)^{n} = ~{a^n|b^n}'],['適用範圍','a、b 為正實數，m、n 為實數']],
ch:[
()=>{let m,n;do{m=ri(2,6);n=ri(2,6)}while(m===n);return mkq(`a^{${m}}×a^{${n}} = ？`,E(m+n),[E(m*n),E(Math.abs(m-n)),E(2*(m+n)),E(m*n+1)],`同底相乘，指數相加：${m}+${n} = ${m+n}。`)},
()=>{const n=ri(1,4),m=n+ri(2,4);return mkq(`a^{${m}}÷a^{${n}} = ？`,E(m-n),[E(m+n),E(m*n),E(n-m),E(m-n+1)],`同底相除，指數相減：${m}−${n} = ${m-n}。`)},
()=>{let m,n;do{m=ri(2,5);n=ri(2,5)}while(m===n);return mkq(`(a^{${m}})^{${n}} = ？`,E(m*n),[E(m+n),E(m**n),E(m*n+1)],`指數相乘：${m}×${n} = ${m*n}。`)},
()=>{const n=ri(2,5);return mkq(`(ab)^{${n}} = ？`,`a^{${n}}×b^{${n}}`,[`a×b^{${n}}`,`a^{${n}}+b^{${n}}`,`a^{${n}}×b`],`(ab)^{n} = a^{n}×b^{n}。`)},
tf('a^{m}+a^{n} = a^{m+n}',false,'指數律是「相乘」才指數相加，加法不能這樣合併。'),
()=>{const [x,y]=pk([[2,3],[2,5],[3,4]]),m=ri(2,4);return tf(`${x}^{${m}}×${y}^{${m}} = ${x*y}^{${m}}`,true,`a^{n}×b^{n} = (ab)^{n}，(${x}×${y})^{${m}} = ${x*y}^{${m}}。`)},
()=>{const m=ri(2,4),n=ri(2,4);return tf(`(2^{${m}})^{${n}} = 2^{${m+n}}`,false,`(a^{m})^{n} = a^{mn}，應為 2^{${m*n}}。`)},
tf('5^{-2} = −25',false,'5^{-2} = ~{1|25}，負指數不是負數。'),
tf('(−3)^{0} = 1',true,'底數不為 0 時，a^{0} = 1。'),
tf('0^{0} = 1',false,'教材指出 0^{0} 為無意義。')],
mt:[['a^{m}×a^{n}','a^{m+n}'],['a^{m}÷a^{n}','a^{m−n}'],['(a^{m})^{n}','a^{mn}'],['(ab)^{n}','a^{n}×b^{n}'],['(a/b)^{n}','~{a^n|b^n}']],
fl:[
()=>{const m=ri(1,6),n=ri(1,6);return{q:`a^{${m}}×a^{${n}} = a^{□}`,a:String(m+n),w:`${m}+${n} = ${m+n}。`}},
()=>{const n=ri(1,5),m=n+ri(1,4);return{q:`a^{${m}}÷a^{${n}} = a^{□}`,a:String(m-n),w:`${m}−${n} = ${m-n}。`}},
()=>{const m=ri(2,4),n=ri(2,4);return{q:`(a^{${m}})^{${n}} = a^{□}`,a:String(m*n),w:`${m}×${n} = ${m*n}。`}},
()=>Math.random()<.5?(()=>{const b=pk([2,3,5,7]);return{q:`${b}^{1/2}×${b}^{1/2} = □`,a:String(b),w:`1/2+1/2 = 1，所以 ${b}^{1} = ${b}。`}})():{q:'a^{1/3}×a^{2/3} = a^{□}',a:'1',w:'1/3+2/3 = 1。'}],
od:[]}
];

const $S=lv=>L[lv].od.length?['learn','order','choice','match','fill']:['learn','choice','match','fill'];
const NM={learn:'📖 學習重點',order:'證明排序',choice:'選擇題',match:'配對',fill:'填充'};
const full=i=>$S(i).length-1;
let S={lv:0,st:0,done:[0,0,0,0]},g={};
try{const d=JSON.parse(localStorage.getItem('eq2')||'null');if(d)S.done=d}catch(e){}
const save=()=>{try{localStorage.setItem('eq2',JSON.stringify(S.done))}catch(e){}};
const go=(lv,st)=>{S.lv=lv;S.st=st;g={};render()};
const lock=i=>i>0&&S.done[i-1]<full(i-1);
const NUM=['①','②','③','④'];
function render(){
 const ks=$S(S.lv);
 $('#nav').innerHTML='<div class="tabs">'+L.map((l,i)=>`<button class="tab ${i==S.lv?'on':''}" ${lock(i)?'disabled':''} onclick="go(${i},0)">${lock(i)?'🔒':l.ic} ${l.k}${S.done[i]>=full(i)?' ✅':''}</button>`).join('')+'</div><div class="tabs sub">'+
 ks.map((k,j)=>{const lk=j>0&&S.done[S.lv]<j-1;return `<button class="tab ${j==S.st?'on':''}" ${lk?'disabled':''} onclick="go(${S.lv},${j})">${lk?'🔒 ':''}${j?NUM[j-1]+' ':''}${NM[k]}${j>0&&S.done[S.lv]>=j?' ✔':''}</button>`}).join('')+'</div>';
 ({learn,order,choice,match,fill})[ks[S.st]]();
}
const B=h=>$('#body').innerHTML='<div class="box">'+h+'</div>';
function learn(){const lv=L[S.lv];
 B(`<h3>${lv.ic} ${lv.k}：先讀重點，再點卡片翻面</h3><div class="info">${fmt(lv.info)}</div><div class="grid">`+lv.cards.map(c=>`<div class="card" onclick="this.classList.toggle('f')"><div class="fr"><b>${fmt(c[0])}</b><small>（點一下翻面）</small></div><div class="bk">${fmt(c[1])}</div></div>`).join('')+`</div><button class="btn" onclick="go(S.lv,1)">我記好了，開始闖關 ▶</button>`)}
function res(ok,txt){const st=S.st;
 if(ok){S.done[S.lv]=Math.max(S.done[S.lv],st);save()}
 let nx='';
 if(ok){nx=st<full(S.lv)?`<button class="btn" onclick="go(S.lv,${st+1})">下一關 ▶</button>`:S.lv<3?`<button class="btn" onclick="go(${S.lv+1},0)">解鎖下一單元：${L[S.lv+1].k} ▶</button>`:'<h3>🏆 全部通關！2-1.1 至 2-1.4 都學會了。</h3>'}
 B(`<div class="res"><h2>${ok?'✅ 通過':'❌ 未通過'}</h2><p>${txt}</p>${nx}<button class="btn alt" onclick="go(S.lv,${st})">${ok?'再玩一次（題目會重新隨機）':'重新挑戰（題目會重新隨機）'}</button>${ok?'':`<button class="btn alt" onclick="go(S.lv,0)">回去複習</button>`}</div>`)}
function choice(){const lv=L[S.lv];
 if(!g.qs){g.qs=sh(lv.ch.map(x=>typeof x==='function'?x():x)).slice(0,5);g.i=0;g.c=0;g.a=null;g.cur=null}
 const n=g.qs.length;
 if(g.i>=n)return res(g.c===n,`答對 ${g.c} / ${n} 題（需全部答對）`);
 const q=g.qs[g.i];if(!g.cur){const m=q.o.map((x,i)=>({x,c:i===q.a}));g.cur=q.o.length>2?sh(m):m}
 B(`<div class="prog">第 ${g.i+1} / ${n} 題</div><div class="q">${fmt(q.q)}</div>`+
 g.cur.map((z,j)=>{let c='';if(g.a!==null){if(z.c)c='ok';else if(j===g.a)c='no'}return `<button class="opt ${c}" ${g.a!==null?'disabled':''} onclick="pick(${j})">${fmt(z.x)}</button>`}).join('')+
 (g.a!==null?`<p>${fmt(q.w)}</p><button class="btn" onclick="g.i++;g.a=null;g.cur=null;choice()">${g.i+1<n?'下一題':'看結果'} ▶</button>`:''))}
function pick(j){g.a=j;if(g.cur[j].c)g.c++;choice()}
function pickPairs(pool,k){const out=[],rs=new Set(),gs=new Set();
 for(const p of sh(pool)){if(out.length>=k)break;if(rs.has(p[1]))continue;if(p[2]&&gs.has(p[2]))continue;out.push(p);rs.add(p[1]);if(p[2])gs.add(p[2])}return out}
function match(){const lv=L[S.lv];
 if(!g.p){g.p=pickPairs(lv.mt,S.lv===3?4:5);g.r=sh(g.p.map((_,i)=>i));g.s=null;g.dn=[];g.e=0}
 if(g.dn.length===g.p.length)return res(g.e===0,`全部配對完成，錯誤 ${g.e} 次（需 0 次錯誤）`);
 B(`<div class="q">把左邊配到意思相同的右邊：先點左邊，再點右邊。　<span class="prog">錯誤 ${g.e} 次</span></div><div class="cols"><div>`+
 g.p.map((u,i)=>`<div class="m ${g.dn.includes(i)?'dn':''} ${g.s===i?'sel':''}" style="margin:6px 0" onclick="ml(${i})">${fmt(u[0])}</div>`).join('')+'</div><div>'+
 g.r.map(i=>`<div class="m ${g.dn.includes(i)?'dn':''}" style="margin:6px 0" onclick="mr(${i})">${fmt(g.p[i][1])}</div>`).join('')+'</div></div>')}
function ml(i){if(g.dn.includes(i))return;g.s=i;match()}
function mr(i){if(g.s===null||g.dn.includes(i))return;
 if(g.s===i){g.dn.push(i);g.s=null;match()}else{g.e++;g.s=null;match()}}
function fill(){const lv=L[S.lv];
 if(!g.qs){g.qs=sh(lv.fl).slice(0,4).map(f=>f());g.ck=false}
 B(`<div class="q">填入答案（請輸入數字，負數請加負號，例：−3）。</div>`+g.qs.map((x,i)=>`<div class="q">${i+1}. ${fmt(x.q)}　<input type="text" id="f${i}" inputmode="text" autocomplete="off" ${g.ck?'disabled':''} value="${g.v?g.v[i]:''}"><span class="fb" id="b${i}"></span></div>`).join('')+
 (g.ck?`<button class="btn" onclick="fin()">看結果 ▶</button>`:`<button class="btn" onclick="chk()">送出</button>`));
 if(g.ck)g.qs.forEach((x,i)=>{$('#b'+i).innerHTML=g.o[i]?'✅':`❌ 正確：${x.a}（${fmt(x.w)}）`})}
const num=s=>{s=String(s).replace(/−/g,'-').replace(/[,，\s]/g,'');let m;if(m=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/))return +m[1]/+m[2];if(/^-?\d+(\.\d+)?$/.test(s))return +s;return NaN};
function chk(){g.v=g.qs.map((_,i)=>$('#f'+i).value);
 g.o=g.qs.map((x,i)=>{const v=num(g.v[i]);return !isNaN(v)&&Math.abs(v-num(x.a))<1e-9});
 g.ck=true;fill()}
function fin(){const n=g.qs.length,c=g.o.filter(Boolean).length;res(c===n,`答對 ${c} / ${n} 題（需全部答對）`)}
function shufNot(steps){let a;do{a=sh(steps.map((x,i)=>({x,i})))}while(a.every((z,i)=>z.i===i));return a}
function order(){const lv=L[S.lv];
 if(g.t===undefined){g.t=0;g.e=0;g.n=0;g.od=lv.od;g.items=null}
 if(g.t>=g.od.length)return res(g.e<=3,`完成全部步驟排序，錯誤 ${g.e} 次（需 3 次以內）`);
 const t=g.od[g.t];if(!g.items)g.items=shufNot(t.steps);
 const done=g.n===t.steps.length;
 B(`<div class="prog">第 ${g.t+1} / ${g.od.length} 題　錯誤 ${g.e} 次</div><div class="q"><b>${fmt(t.title)}</b><br>依序點選，排出正確的步驟（由上到下）：</div>`+
 t.steps.slice(0,g.n).map(s=>`<div class="st">${fmt(s)}</div>`).join('')+
 (done?`<p>✅ 完成！</p><button class="btn" onclick="g.t++;g.n=0;g.items=null;order()">${g.t+1<g.od.length?'下一題':'看結果'} ▶</button>`:g.items.map(z=>`<button class="opt" onclick="op(${z.i})">${fmt(z.x)}</button>`).join('')))}
function op(i){if(i===g.n){g.n++;g.items=g.items.filter(z=>z.i!==i)}else g.e++;order()}
render();
</script></body></html>
